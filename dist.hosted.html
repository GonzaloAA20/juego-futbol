<title>El Camino · Simulador de carrera de fútbol</title>
<meta name="theme-color" content="#070b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* El juego vive en una sola atmósfera, como el marcador de un estadio de noche.
   Se fija el fondo oscuro pase lo que pase con el tema del visor. */
html, :root[data-theme="light"], :root[data-theme="dark"] { background: #070b10; color-scheme: dark; }
/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html {
  background: #070b10;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
/* En móvil todo se toca: sin retardo de doble toque, sin destello gris al pulsar,
   y sin que el rebote del scroll se lleve la página entera. */
button, .opt, .pick, .tab, .plus, a, input, select, label {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
:root {
  --bg: #070b10;
  --bg2: #0c1219;
  --panel: #111a24;
  --panel2: #16212d;
  --line: #22303f;
  --line2: #2e4054;
  --txt: #e8eef5;
  --dim: #8ea0b5;
  --dim2: #64798f;
  --acc: #2ee66b;
  --acc2: #14b8a6;
  --gold: #ffc93c;
  --red: #ff5d5d;
  --blue: #4da3ff;
  --purple: #b58cff;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
body {
  background:
    radial-gradient(1100px 700px at 12% -10%, #123 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 0%, #0c2a22 0%, transparent 55%),
    var(--bg);
  color: var(--txt);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 800; letter-spacing: -.02em; }
p { margin: 0 0 10px; }
button { font-family: inherit; color: inherit; }
input, select { font-family: inherit; }
a { color: var(--acc); }
::selection { background: var(--acc); color: #04140a; }

/* Scrollbar */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: #223140; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-thumb:hover { background: #34495e; background-clip: padding-box; }

#app { max-width: 1120px; margin: 0 auto; padding: 16px 14px calc(90px + env(safe-area-inset-bottom)); }

/* ---------- Utilidades ---------- */
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.center { justify-content: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.hide { display: none !important; }
.mt { margin-top: 14px; }
.mt-s { margin-top: 8px; }
.tc { text-align: center; }
.dim { color: var(--dim); }
.dim2 { color: var(--dim2); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; color: var(--dim2); }
.mono { font-variant-numeric: tabular-nums; }
.b { font-weight: 700; }
.acc { color: var(--acc); } .gold { color: var(--gold); } .red { color: var(--red); }
.blue { color: var(--blue); } .purple { color: var(--purple); }

/* ---------- Paneles ---------- */
.card {
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg2) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card.tight { padding: 12px; }
.card + .card { margin-top: 12px; }
.sub { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #0e1720; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--panel2); border: 1px solid var(--line2); color: var(--txt);
  padding: 11px 16px; border-radius: 11px; cursor: pointer; font-weight: 700; font-size: 14px;
  min-height: 44px;
  transition: transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s;
  text-align: center;
}
.btn:hover { background: #1d2b3a; border-color: #3d566e; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(180deg, #2ee66b, #17b552); color: #052a14; border-color: #2ee66b;
  box-shadow: 0 6px 18px rgba(46,230,107,.25);
}
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--dim); }
.btn.ghost:hover { color: var(--txt); border-color: var(--line2); background: #131e29; }
.btn.danger { border-color: #5a2731; color: #ff9b9b; background: #1c1015; }
.btn.danger:hover { background: #2a161c; }
.btn.wide { width: 100%; }
.btn.sm { padding: 7px 11px; font-size: 12.5px; border-radius: 9px; min-height: 36px; }

/* ---------- Formularios ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.input, .select {
  background: #0b131b; border: 1px solid var(--line2); color: var(--txt);
  padding: 12px; border-radius: 11px; font-size: 16px; width: 100%; outline: none;
  min-height: 46px;
}
/* Las flechitas del campo numérico son inútiles con el dedo */
.input[type=number]::-webkit-outer-spin-button,
.input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.input:focus, .select:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(46,230,107,.13); }
label.tiny { margin-bottom: 2px; }

/* ---------- Cabecera ---------- */
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.brand-logo {
  width: 44px; height: 44px; border-radius: 13px; flex: none;
  background: linear-gradient(145deg, #2ee66b, #0d8f6a); color: #04140a;
  display: grid; place-items: center; font-size: 24px; box-shadow: 0 8px 22px rgba(46,230,107,.28);
}
.brand h1 { font-size: 21px; }
.brand .tiny { letter-spacing: .12em; }

/* ---------- Pasos de creación ---------- */
.steps { display: flex; gap: 6px; margin-bottom: 16px; }
.step { flex: 1; height: 4px; border-radius: 4px; background: #1b2836; }
.step.on { background: linear-gradient(90deg, var(--acc), var(--acc2)); }

/* ---------- Grid de opciones ---------- */
.grid { display: grid; gap: 10px; }
.grid.g2 { grid-template-columns: repeat(2, 1fr); }
.grid.g3 { grid-template-columns: repeat(3, 1fr); }
.grid.g4 { grid-template-columns: repeat(4, 1fr); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.grid.autowide { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

.pick {
  background: #0e1721; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px;
  cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
  min-height: 52px;
  transition: border-color .12s, background .12s, transform .08s;
}
.pick:hover { border-color: var(--line2); background: #142030; }
.pick:active { transform: scale(.985); }
.pick.on { border-color: var(--acc); background: #0f2419; box-shadow: 0 0 0 1px var(--acc) inset; }
.pick .flag { font-size: 22px; line-height: 1; flex: none; }
.pick .nm { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Camiseta (preview) ---------- */
.kitwrap { display: grid; place-items: center; padding: 6px 0; }
.kit { width: 210px; max-width: 62vw; filter: drop-shadow(0 14px 26px rgba(0,0,0,.5)); }
.kit .kname { font: 800 15px/1 var(--font); letter-spacing: 1px; text-transform: uppercase; }
.kit .knum { font: 900 62px/1 var(--font); letter-spacing: -2px; }

/* ---------- Escudos ---------- */
.crest { flex: none; display: block; }
.crest-lg { width: 46px; height: 52px; }
.crest-md { width: 30px; height: 34px; }
.crest-sm { width: 21px; height: 24px; }

/* ---------- HUD del jugador ---------- */
.hud { position: relative; overflow: hidden; }
.hud::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(420px 180px at 88% -30%, rgba(46,230,107,.14), transparent 70%);
}
.ovr {
  width: 74px; height: 74px; border-radius: 20px; flex: none; display: grid; place-items: center;
  background: linear-gradient(150deg, #1b2a38, #0d151d); border: 1px solid var(--line2); position: relative;
}
.ovr b { font-size: 30px; font-weight: 900; letter-spacing: -1px; }
.ovr .tiny { font-size: 9.5px; }
.ovr.t-elite { border-color: var(--gold); box-shadow: 0 0 22px rgba(255,201,60,.22) inset; }
.ovr.t-star { border-color: var(--purple); }
.ovr.t-good { border-color: var(--blue); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; background: #16212d; border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700; color: var(--dim);
}
.chip.on { color: var(--acc); border-color: #1e5a38; background: #0f2419; }
.chip.warn { color: var(--gold); border-color: #5b4a1a; background: #221c0d; }
.chip.bad { color: var(--red); border-color: #5a2731; background: #1f1013; }

/* ---------- Barras ---------- */
.bar { height: 7px; border-radius: 7px; background: #182432; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--acc2), var(--acc)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar.gold > i { background: linear-gradient(90deg, #b98a1a, var(--gold)); }
.bar.blue > i { background: linear-gradient(90deg, #2b6fb5, var(--blue)); }
.bar.red > i { background: linear-gradient(90deg, #a33, var(--red)); }
.bar.purple > i { background: linear-gradient(90deg, #6b4bb5, var(--purple)); }

/* ---------- Estadísticas ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(74px, 1fr)); gap: 8px; }
.stat { background: #0e1720; border: 1px solid var(--line); border-radius: 11px; padding: 9px 8px; text-align: center; }
.stat b { display: block; font-size: 19px; font-weight: 900; letter-spacing: -.5px; }
.stat span { font-size: 10.5px; color: var(--dim2); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

/* ---------- Feed de temporada ---------- */
.feed { display: flex; flex-direction: column; gap: 8px; }
.ev {
  display: flex; gap: 10px; padding: 10px 12px; border-radius: 11px;
  background: #0e1720; border: 1px solid var(--line); border-left: 3px solid var(--line2);
  animation: pop .28s cubic-bezier(.2,.9,.3,1.2) both;
}
.ev .ic { font-size: 16px; line-height: 1.35; flex: none; }
.ev.good { border-left-color: var(--acc); }
.ev.bad { border-left-color: var(--red); }
.ev.gold { border-left-color: var(--gold); background: #1a1608; }
.ev.info { border-left-color: var(--blue); }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Tarjetas de decisión ---------- */
.opt {
  width: 100%; text-align: left; background: #0e1721; border: 1px solid var(--line);
  border-radius: 13px; padding: 14px; cursor: pointer; min-height: 56px;
  transition: border-color .12s, background .12s, transform .08s;
}
.opt:hover { border-color: var(--acc); background: #101f19; }
.opt:active { transform: scale(.99); }
.opt .t { font-weight: 800; font-size: 14.5px; margin-bottom: 3px; }
.opt .d { font-size: 12.5px; color: var(--dim); }
.opt .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Tablas ---------- */
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 460px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim2); font-weight: 800; }
tbody tr:hover { background: #101a24; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Pestañas ---------- */
.tabs { display: flex; gap: 4px; background: #0c141d; border: 1px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; }
.tab { flex: 1; padding: 9px 12px; border-radius: 9px; border: none; background: transparent; color: var(--dim);
  cursor: pointer; font-weight: 700; font-size: 12.5px; white-space: nowrap; min-height: 40px; }
.tab.on { background: var(--panel2); color: var(--txt); box-shadow: 0 2px 8px rgba(0,0,0,.3); }

/* ---------- Modal ---------- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(3,6,10,.78); backdrop-filter: blur(6px);
  display: grid; place-items: center; padding: 16px; z-index: 60; animation: fade .18s both;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.modal {
  width: min(560px, 100%); max-height: 86vh; overflow-y: auto;
  background: linear-gradient(180deg, #131e29, #0a1119); border: 1px solid var(--line2);
  border-radius: 18px; padding: 18px; box-shadow: 0 30px 70px rgba(0,0,0,.6);
  animation: rise .26s cubic-bezier(.2,.9,.3,1.1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97) } to { opacity: 1; transform: none } }

/* ---------- Momento clave ---------- */
.moment { background: linear-gradient(160deg, #1d2a13, #0b1219); border-color: #3b5a22; }
.moment .hdr { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); animation: pulse 1.1s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(46,230,107,.55) } 70% { box-shadow: 0 0 0 9px rgba(46,230,107,0) } }

/* ---------- Trofeos ---------- */
.trophy { display: flex; gap: 9px; align-items: center; background: #14110a; border: 1px solid #45391a;
  border-radius: 11px; padding: 9px 11px; }
.trophy .ic { font-size: 18px; }
.trophy .n { font-weight: 800; font-size: 13px; }

/* ---------- Skill tree ---------- */
.skill { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: #0e1720;
  border: 1px solid var(--line); border-radius: 11px; }
.skill .lab { width: 108px; flex: none; font-size: 12.5px; font-weight: 700; }
.skill .val { width: 30px; text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }
.plus { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line2); background: #16212d;
  cursor: pointer; font-weight: 900; font-size: 19px; line-height: 1; flex: none; }
.plus:hover:not(:disabled) { background: #1d5c37; border-color: var(--acc); color: #fff; }
.plus:disabled { opacity: .28; cursor: not-allowed; }

/* ---------- Barra inferior ---------- */
.actionbar {
  position: sticky; bottom: 0; margin: 14px -14px -90px;
  padding: 12px 14px calc(18px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(7,11,16,0) 0%, rgba(7,11,16,.93) 32%, var(--bg) 100%);
  z-index: 20;
}

/* ---------- Pantalla de carga / cinemática ---------- */
.cinema { display: grid; place-items: center; min-height: 46vh; text-align: center; gap: 14px; }
.cinema .big { font-size: 34px; font-weight: 900; letter-spacing: -.03em; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #1f2e3d; border-top-color: var(--acc); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }

/* ---------- Buscador país ---------- */
.scroller { max-height: min(52vh, 400px); overflow-y: auto; padding-right: 4px; -webkit-overflow-scrolling: touch; }

/* ---------- Responsive ---------- */
/* ---------- Móvil ----------
   En pantalla pequeña el modal deja de ser una ventana flotante y pasa a ser una
   hoja que sube desde abajo: queda al alcance del pulgar y se cierra deslizando
   la vista hacia el contenido, que es como se espera que funcione en un teléfono. */
@media (max-width: 700px) {
  .modal-bg { align-items: end; padding: 0; }
  .modal {
    width: 100%; max-width: none; max-height: 88vh;
    border-radius: 22px 22px 0 0; border-bottom: 0;
    padding: 4px 14px calc(20px + env(safe-area-inset-bottom));
    animation: sheet .28s cubic-bezier(.2, .9, .3, 1.04) both;
  }
  .modal::before {
    content: ''; display: block; width: 40px; height: 4px; border-radius: 4px;
    background: #33465c; margin: 8px auto 14px;
  }
}
@keyframes sheet { from { transform: translateY(100%) } to { transform: none } }

@media (max-width: 640px) {
  #app { padding: 12px 12px calc(96px + env(safe-area-inset-bottom)); }
  .grid.g4 { grid-template-columns: repeat(2, 1fr); }
  .grid.g3 { grid-template-columns: repeat(2, 1fr); }
  .ovr { width: 62px; height: 62px; border-radius: 17px; }
  .ovr b { font-size: 25px; }
  .brand h1 { font-size: 18px; }
  .brand-logo { width: 40px; height: 40px; font-size: 21px; }
  .actionbar { margin-left: -12px; margin-right: -12px; }
  .card { padding: 14px; }
  .card + .card { margin-top: 10px; }
  /* Los textos largos de eventos y tramas se leen mejor algo más grandes */
  .card > p.dim, .modal p { font-size: 15px; line-height: 1.55; }
  .opt .t { font-size: 15px; }
  .opt .d { font-size: 13px; }
  table { min-width: 0; font-size: 13.5px; }
  th, td { padding: 9px 8px; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .kit { width: 190px; }
  .skill { padding: 8px 10px; gap: 8px; }
  .skill .lab { width: 84px; font-size: 12px; }
  /* Con el dedo, 36 px se falla; en móvil todo lo pulsable sube a 42-44 */
  .btn.sm { min-height: 40px; padding: 8px 12px; }
  .plus { width: 42px; height: 42px; }
}
@media (max-width: 380px) {
  .grid.g3, .grid.g4 { grid-template-columns: 1fr 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .chip { font-size: 11px; padding: 3px 8px; }
}
/* Móvil en horizontal: el teclado y la barra comen mucho alto */
@media (max-height: 480px) and (orientation: landscape) {
  .scroller { max-height: 46vh; }
  .modal { max-height: 92vh; }
}
/* Quien prefiere menos animación, menos animación */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>

  ['TUR','Turquía','🇹🇷','UEFA',3,'#c8102e','#ffffff','#ffffff','TUR',['GER','ENG','ITA']],

/* Devuelve los torneos internacionales que se juegan el verano de `year` */
function tournamentsInYear(year, confed) {
  return NT_TOURNAMENTS.filter((t) => {
    if (t.confed !== '*' && t.confed !== confed) return false;
    const d = year - t.base;
    return d >= 0 && d % t.every === 0;
  });
}

function youthTournamentsInYear(year, confed) {
  return YOUTH_TOURNAMENTS.filter((t) => {
    if (t.confed && t.confed !== confed) return false;
    const d = year - t.base;
    return d >= 0 && d % t.every === 0;
  });
}

/* ---------- Probabilidad de un momento clave ---------- */
function momentChance(G, opt) {
  const p = G.player;
  const attrs = (opt.a || []).filter((k) => p.attrs[k] != null);
  const avg = attrs.length ? attrs.reduce((s, k) => s + p.attrs[k], 0) / attrs.length : p.ovr;
  let prob = opt.base + (avg - 62) * 0.0075 + (p.form / 900) + (p.morale - 60) / 1400;
  if (p.traits.includes('clutch')) prob += 0.09;
  if (p.traits.includes('hothead') && opt.base < 0.5) prob -= 0.03;
  return clamp(prob, 0.05, 0.95);
}

/* ---------- Aleatoriedad ---------- */
let RNG_STATE = (Math.random() * 4294967296) >>> 0;
function seedRng(s) { RNG_STATE = (s >>> 0) || 1; }
function rnd() {
  // mulberry32
  RNG_STATE |= 0; RNG_STATE = (RNG_STATE + 0x6D2B79F5) | 0;
  let t = Math.imul(RNG_STATE ^ (RNG_STATE >>> 15), 1 | RNG_STATE);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));          // entero [a,b]
const rf = (a, b) => a + rnd() * (b - a);
const chance = (p) => rnd() < p;
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
function pickW(items, weightFn) {
  let total = 0;
  const ws = items.map((it) => { const w = Math.max(0, weightFn(it)); total += w; return w; });
  if (total <= 0) return pick(items);
  let r = rnd() * total;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
// Distribucion normal truncada
function gauss(mean, sd, lo, hi) {
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return clamp(mean + z * sd, lo, hi);
}
function poisson(lambda) {
  if (lambda <= 0) return 0;
  if (lambda > 24) return Math.max(0, Math.round(gauss(lambda, Math.sqrt(lambda), 0, lambda * 3)));
  const L = Math.exp(-lambda); let k = 0, p = 1;
  do { k++; p *= rnd(); } while (p > L);
  return k - 1;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r1 = (v) => Math.round(v * 10) / 10;

function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }
function luminance(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (

  ));
}

/* ---------- Creacion del jugador ---------- */
function rollPotential(bonus) {
  // La mayoria se queda en 70-82. Los cracks mundiales son raros de verdad.
  const roll = rnd();
  let base;
  if (roll < 0.34) base = gauss(70, 4, 60, 78);
  else if (roll < 0.70) base = gauss(78, 3.5, 70, 85);
  else if (roll < 0.90) base = gauss(84, 3, 78, 89);
  else if (roll < 0.985) base = gauss(89, 2.5, 84, 94);
  else base = gauss(94, 2.5, 90, 99);
  return clamp(Math.round(base + (bonus || 0)), 58, 99);
}

function createPlayer(opts) {
  const pos = opts.pos;
  const list = attrsFor(pos);
  const p = {
    firstName: opts.firstName, lastName: opts.lastName, shirtName: opts.shirtName,
    number: opts.number, pos, country: opts.country, foot: opts.foot || 'Derecho',
    age: 16, born: opts.startYear - 16,
    attrs: {}, traits: [], sp: 0,
    form: 0, morale: 70, fitness: 95, rep: 8, trust: 55, fanLove: 50,
    injury: null, injuryHistory: 0, proneness: rf(0.75, 1.3),
    club: null, contract: 0, wage: 0, value: 0, role: 'cantera',
    nt: { level: null, caps: 0, goals: 0, calledUp: false, streak: 0 },
    seasonStats: null, career: blankCareer(), history: [], trophies: [], awards: [],
    arcs: {}, flags: {}, legacy: 0, retired: false,
  };
  // Atributos de partida: media ~52-60 segun potencial
  const potential = rollPotential(opts.potBonus || 0);
  p.pot = potential;
  const target = clamp(46 + (potential - 70) * 0.34 + rf(-2, 3), 38, 66);
  const w = WEIGHTS[pos];
  list.forEach((a) => {
    const weight = w[a.key] || 0.04;
    // los atributos importantes de tu posicion nacen algo mas altos
    const v = target + (weight - 0.14) * 42 + rf(-5, 5);
    p.attrs[a.key] = clamp(Math.round(v), 25, 75);
  });
  // toque del jugador segun perfil elegido
  if (opts.archetype && ARCHETYPES[opts.archetype]) {
    const arc = ARCHETYPES[opts.archetype];
    for (const k in arc.mod) if (p.attrs[k] != null) p.attrs[k] = clamp(p.attrs[k] + arc.mod[k], 25, 80);
    if (arc.trait && !p.traits.includes(arc.trait)) p.traits.push(arc.trait);
  }
  p.ovr = computeOvr(p);
  p.value = playerValue(p);
  return p;
}

/* ---------- Valor de mercado ----------
   Calibrado para que 90 de media ~150 M€, 80 ~40 M€, 70 ~7 M€, 60 ~0,6 M€.
   Luego pesan la edad, lo que te queda por crecer y lo conocido que seas. */
function playerValue(p) {
  const base = Math.pow(Math.max(0.6, (p.ovr - 40) / 10), 6) * 0.0096; // millones
  const ageF = p.age <= 17 ? 0.85 : p.age === 18 ? 1.1
    : p.age <= 21 ? 1.45 : p.age <= 25 ? 1.35 : p.age <= 28 ? 1.0
    : p.age <= 31 ? 0.62 : p.age <= 33 ? 0.3 : p.age <= 35 ? 0.15 : 0.05;
  const gap = Math.max(0, p.pot - p.ovr);
  const potF = p.age <= 21 ? Math.min(2.4, 1 + gap * 0.055)
    : p.age <= 25 ? Math.min(1.5, 1 + gap * 0.02) : 1;
  const repF = clamp(0.45 + p.rep / 70, 0.45, 1.6);
  return Math.max(0.02, base * ageF * potF * repF);
}
const fmtM = (v) => (v >= 100 ? Math.round(v) + ' M€' : v >= 10 ? v.toFixed(0) + ' M€' : v >= 1 ? v.toFixed(1) + ' M€' : Math.round(v * 1000) + ' K€');
const fmtWage = (v) => (v >= 1 ? v.toFixed(1) + ' M€/año' : Math.round(v * 1000) + ' K€/año');

/* ---------- Rol en el equipo ---------- */
function squadRole(p, club, compGap) {
  const gap = p.ovr - club.str;
  const young = p.age <= 19 ? -3.5 : p.age <= 21 ? -1.5 : 0;
  // si hay un companiero concreto en tu puesto, el manda tanto como el nivel del club
  const rival = compGap == null ? 0 : clamp(compGap * 0.45, -5, 5);
  const g = gap + young + rival + (p.trust - 55) / 14;
  if (g >= 7) return { key: 'star', name: 'Estrella del equipo', min: 0.92 };
  if (g >= 2.5) return { key: 'key', name: 'Titular indiscutible', min: 0.82 };
  if (g >= -1.5) return { key: 'starter', name: 'Titular', min: 0.68 };
  if (g >= -5) return { key: 'rot', name: 'Rotación', min: 0.45 };
  if (g >= -10) return { key: 'sub', name: 'Suplente', min: 0.22 };
  return { key: 'fringe', name: 'Descarte', min: 0.06 };
}

/* ---------- Fase de eliminatoria alcanzada ---------- */
function roundFromRoll(x) {
  for (const [t, n] of ROUND_NAMES) if (x <= t) return n;
  return 'fase de grupos';
}

/* Frase natural para una eliminatoria que NO se ha ganado.
   `hasGroups` distingue las competiciones con fase de grupos de las copas a partido único. */
function roundPhrase(x, hasGroups) {
  const r = roundFromRoll(x);
  if (r === 'campeón' || r === 'subcampeón') return 'perdéis la final';
  if (r === 'fase de grupos') return hasGroups ? 'os quedáis en la fase de grupos' : 'os eliminan en las primeras rondas';
  return 'caéis en ' + r;
}
/* Como termina una seleccion en un torneo, en frase corregida */
function stagePhrase(stage) {
  return stage.indexOf('eliminad') === 0 ? 'queda ' + stage : 'termina como ' + stage;
}

/* Nacionalidad de un fichaje: casi siempre local, y cuanto mas grande el club, mas extranjeros */
function squadNationality(club) {
  const local = COUNTRY_BY_CODE[club.country];
  const foreignChance = clamp((club.str - 52) / 90, 0.05, 0.62);
  if (!chance(foreignChance)) return local ? local.code : 'ESP';
  const pool = COUNTRIES.filter((c) => c.code !== club.country && c.tier <= 5);
  return pick(pool).code;
}

function makeTeammate(club, pos, ovrTarget, ageHint, taken) {
  const cc = squadNationality(club);
  const age = ageHint != null ? ageHint : clamp(Math.round(gauss(25.5, 4.2, 17, 37)), 17, 37);
  // los jovenes de la plantilla estan por debajo de su techo, los veteranos ya han caido
  let ovr = ovrTarget;
  if (age <= 20) ovr -= ri(3, 9);
  else if (age >= 33) ovr -= ri(1, 5);
  // un vestuario con cuatro jugadores del mismo apellido canta muchísimo
  let name = randomName(cc);
  for (let t = 0; t < 25 && taken && taken.has(name); t++) name = randomName(cc);
  if (taken) taken.add(name);
  return {
    name, country: cc, pos,
    ovr: clamp(Math.round(ovr), 38, 95),
    pot: clamp(Math.round(ovr + (age <= 21 ? ri(4, 14) : age <= 25 ? ri(0, 6) : 0)), 40, 97),
    age,
  };
}

/* Construye una plantilla acorde al nivel del club */
function buildSquad(G, club) {
  const base = club.str;
  const squad = [];
  const taken = takenNames(G);
  SQUAD_SHAPE.forEach(([pos, n]) => {
    for (let i = 0; i < n; i++) {
      // El titular de cada puesto ronda el nivel del club, a veces por encima y a veces
      // por debajo. Así el puesto que te toca varía de club en club en vez de ser
      // siempre un muro: parte de la gracia es caer donde hay hueco.
      const target = base + (i === 0 ? rf(-2, 3.5) : i === 1 ? rf(-5, 0) : rf(-11, -4));
      squad.push(makeTeammate(club, pos, target, null, taken));
    }
  });
  squad.sort((a, b) => b.ovr - a.ovr);
  return squad;
}

/* Quien te disputa el puesto: el mejor companiero de tu posicion */
function competitorFor(G) {
  const p = G.player;
  const squad = G.squad || [];
  const same = squad.filter((t) => t.pos === p.pos);
  if (!same.length) return null;
  return same.reduce((a, b) => (b.ovr > a.ovr ? b : a));
}

/* Un anio mas para todo el vestuario */
function ageSquad(G, club) {
  const out = [];
  const taken = takenNames(G);
  (G.squad || []).forEach((t) => taken.add(t.name));
  (G.squad || []).forEach((t) => {
    t.age++;
    // crecen o caen como el jugador, pero mas simple
    if (t.age <= 28) t.ovr = clamp(t.ovr + Math.max(0, Math.round((t.pot - t.ovr) * rf(0.1, 0.32))), 38, 97);
    else if (t.age >= 31) t.ovr = clamp(t.ovr - Math.round((t.age - 30) * rf(0.4, 1.3)), 30, 97);
    // se retiran o los traspasan
    const leaves = t.age >= 38 || (t.age >= 35 && chance(0.35)) || chance(0.16);
    if (!leaves) out.push(t);
  });
  // fichajes para rellenar los huecos
  SQUAD_SHAPE.forEach(([pos, n]) => {
    const have = out.filter((t) => t.pos === pos).length;
    for (let i = have; i < n; i++) {
      const target = club.str + (i === 0 ? rf(-2, 3.5) : i === 1 ? rf(-5, 0) : rf(-11, -4));
      const nt = makeTeammate(club, pos, target, null, taken);
      nt.isNew = true;
      out.push(nt);
    }
  });
  out.sort((a, b) => b.ovr - a.ovr);
  return out;
}

/* Sincroniza el vestuario con el club actual */
function syncSquad(G) {
  const club = G.club;
  if (!G.squad || G.squadClubId !== club.id) {
    G.squad = buildSquad(G, club);
    G.squadClubId = club.id;
    G.squad.forEach((t) => { t.isNew = false; });
  } else {
    G.squad = ageSquad(G, club);
  }
  // el fichaje estrella de la pretemporada, si lo hay
  G.newRival = null;
  const comp = competitorFor(G);
  if (comp && comp.isNew && comp.ovr >= G.player.ovr - 2) G.newRival = comp;
  return G.squad;
}

/* Cuanto te penaliza (o te beneficia) el companiero que tienes delante */
function competitorGap(G) {
  const comp = competitorFor(G);
  if (!comp) return 0;
  return G.player.ovr - comp.ovr;
}


/* ===== engine.season.js ===== */
/* ============================================================
   SIMULACION DE TEMPORADA
   ============================================================ */

const RELEGATION = { ESP1: 3, ENG1: 3, ITA1: 3, GER1: 2, FRA1: 2, POR1: 2, NED1: 2, BRA1: 4, MEX1: 0 };
const CONT_SLOTS = {
  BRA1: 5, ARG1: 5, COL1: 3, CHI1: 3, ECU1: 3, PAR1: 3, URU1: 3, PER1: 3,
  MEX1: 5, USA1: 4, JPN1: 3, KOR1: 3, KSA1: 3, QAT1: 2, UAE1: 2, AUS1: 1,
};

/* ---------- Mundo dinamico (ascensos y descensos) ---------- */
function leagueOfClub(G, club) { return (G.world && G.world[club.id]) || club.league; }
function leagueMembers(G, lk) { return CLUBS.filter((c) => leagueOfClub(G, c) === lk); }

/* ---------- Clasificacion simulada de una liga ---------- */
function simulateTable(G, lk, playerBoost) {
  const members = leagueMembers(G, lk);
  if (!members.length) return [];
  const avg = members.reduce((s, c) => s + c.str, 0) / members.length;
  const games = (members.length - 1) * 2;
  const rows = members.map((c) => {
    let pts = games * 1.38 + (c.str - avg) * (games / 17) + gauss(0, games * 0.19, -games, games);
    if (playerBoost && c.id === playerBoost.clubId) pts += playerBoost.pts;
    pts = clamp(Math.round(pts), 8, games * 2.6);
    return { club: c, pts };
  });
  rows.sort((a, b) => b.pts - a.pts || b.club.str - a.club.str);
  rows.forEach((r, i) => { r.pos = i + 1; });
  return rows;
}

/* ---------- Contribucion del jugador a su equipo ---------- */
function playerImpactPoints(p, club, stats) {
  const gap = p.ovr - club.str;
  const base = clamp(gap * 0.32, -3, 5);
  const prod = ((stats.goals || 0) + (stats.assists || 0) * 0.7) * 0.16;
  return clamp(base + prod * (stats.mins > 900 ? 1 : 0.4), -4, 9);
}

/* ---------- Partidos disponibles ---------- */
function seasonFixtures(G, club, euroTier) {
  const lk = leagueOfClub(G, club);
  const lg = LEAGUES[lk];
  const members = leagueMembers(G, lk).length || 18;
  const league = (members - 1) * 2;
  const cupRun = 1 + poisson(1.4 + club.prestige / 55);
  const cup = clamp(cupRun, 1, 7);
  let cont = 0;
  if (euroTier === 'ucl') cont = 8 + poisson(2.4);
  else if (euroTier === 'uel') cont = 8 + poisson(1.8);
  else if (euroTier === 'uecl') cont = 6 + poisson(1.6);
  else if (euroTier === 'cont') cont = 6 + poisson(2.2);
  return { league, cup, cont: Math.min(cont, 17), total: league + cup + Math.min(cont, 17), lg, lk };
}

/* ---------- Lesiones ---------- */
const INJURIES = [
  { n: 'Sobrecarga muscular', w: [1, 2], sev: 1 },
  { n: 'Esguince de tobillo', w: [2, 5], sev: 1 },
  { n: 'Rotura de fibras', w: [3, 7], sev: 2 },
  { n: 'Lesión en el isquiotibial', w: [3, 8], sev: 2 },
  { n: 'Fractura del quinto metatarsiano', w: [8, 14], sev: 3 },
  { n: 'Lesión de menisco', w: [8, 16], sev: 3 },
  { n: 'Pubalgia crónica', w: [6, 12], sev: 3 },
  { n: 'Rotura del ligamento cruzado', w: [26, 40], sev: 4 },
  { n: 'Rotura del tendón de Aquiles', w: [24, 38], sev: 4 },
];
function rollInjuries(p, mods) {
  const out = [];
  let risk = 0.30 * p.proneness * (mods.injuryRisk || 1);
  if (p.traits.includes('ironman')) risk *= 0.5;
  if (p.traits.includes('glass')) risk *= 1.75;
  if (p.age >= 31) risk *= 1 + (p.age - 30) * 0.12;
  if (p.age <= 18) risk *= 0.85;
  risk *= 1 + (70 - clamp(p.fitness, 20, 100)) / 130;
  let tries = 3;
  while (tries-- > 0 && chance(risk)) {
    const sevRoll = rnd();
    const pool = sevRoll < 0.55 ? INJURIES.slice(0, 2)
      : sevRoll < 0.85 ? INJURIES.slice(2, 4)
      : sevRoll < 0.975 ? INJURIES.slice(4, 7) : INJURIES.slice(7);
    const inj = pick(pool);
    out.push({ name: inj.n, weeks: ri(inj.w[0], inj.w[1]), sev: inj.sev });
    risk *= 0.45;
  }
  return out;
}

/* ---------- Nucleo: simular la temporada del jugador ---------- */
function simulateSeason(G) {
  const p = G.player;
  const club = G.club;
  const mods = G.mods;
  const lk = leagueOfClub(G, club);
  const lg = LEAGUES[lk];
  const rep = { feed: [], titles: [], stats: null };

  /* --- lesiones --- */
  const injuries = rollInjuries(p, mods);
  const weeksOut = injuries.reduce((s, i) => s + i.weeks, 0);
  G.lastInjurySev = injuries.reduce((m, i) => Math.max(m, i.sev), 0);
  p.career.injuries += injuries.length;
  const seasonWeeks = 40;
  const availFrac = clamp(1 - weeksOut / seasonWeeks, 0.03, 1);

  /* --- partidos --- */
  const euroKey = club.academy ? club.parent : club.id;
  const euroTier = G.euro && G.euro[euroKey] ? G.euro[euroKey] : null;
  const fx = seasonFixtures(G, club, euroTier);

  /* --- minutos --- */
  const role = squadRole(p, club, competitorGap(G));
  let share = role.min;
  share *= 1 + (p.form / 260) + ((p.morale - 60) / 500) + ((p.trust - 55) / 320);
  share *= (mods.mins || 1);
  if (p.traits.includes('engine')) share *= 1.06;
  if (p.age >= 34) share *= 1 - (p.age - 33) * 0.06;
  if (club.academy) share = clamp(share + 0.25, 0, 0.95);
  share = clamp(share, 0.02, 0.97);

  const availableMatches = Math.round(fx.total * availFrac);
  let apps = Math.round(availableMatches * clamp(share * 1.04, 0, 0.98));
  apps = clamp(apps, 0, availableMatches);
  const minsPerApp = clamp(28 + share * 60 + rf(-4, 4), 15, 90);
  const mins = Math.round(apps * minsPerApp);
  const nineties = mins / 90;

  /* --- produccion --- */
  const posDef = POS_BY_KEY[p.pos];
  const ovrScale = Math.pow(clamp(p.ovr, 40, 99) / 75, 2.6);
  const teamAtk = Math.pow(clamp(club.str, 40, 95) / 72, 1.15);
  const leagueAdj = Math.pow(78 / clamp(lg ? lg.rep : 70, 45, 100), 0.34);
  let gMul = 1, aMul = 1;
  if (p.traits.includes('freekick')) gMul *= 1.15;
  if (p.traits.includes('poacher')) { gMul *= 1.18; aMul *= 0.9; }
  if (p.traits.includes('wizard')) aMul *= 1.2;
  gMul *= (mods.goals || 1); aMul *= (mods.assists || 1);

  const stats = { apps, mins, goals: 0, assists: 0, motm: 0, yellow: 0, red: 0, cs: 0, saves: 0, conceded: 0, rating: 0 };

  if (p.pos === 'GK') {
    const defQ = Math.pow(clamp(club.str, 40, 95) / 72, 1.5) * Math.pow(p.ovr / 75, 0.55);
    let concPer90 = clamp(1.42 / defQ * leagueAdj, 0.28, 3.2);
    if (p.traits.includes('wall')) concPer90 *= 0.9;
    stats.conceded = poisson(concPer90 * nineties);
    stats.saves = poisson(clamp(2.4 + (1.6 - concPer90) * -1.1 + rf(-.3, .5), 1.2, 5.4) * nineties);
    // porterias a cero: aproximacion de Poisson(0) por partido
    const csP = Math.exp(-concPer90 * (minsPerApp / 90));
    stats.cs = 0;
    for (let i = 0; i < apps; i++) if (chance(csP)) stats.cs++;
    stats.assists = poisson(0.02 * nineties * (p.traits.includes('sweeper') ? 3 : 1));
    stats.goals = chance(0.012 * nineties) ? 1 : 0;
  } else {
    stats.goals = poisson(posDef.g * ovrScale * teamAtk * leagueAdj * gMul * nineties) + (mods.extraGoals || 0);
    stats.assists = poisson(posDef.a * ovrScale * Math.pow(teamAtk, 0.7) * leagueAdj * aMul * nineties);
  }
  stats.goals = Math.max(0, stats.goals);
  const cardBase = (p.pos === 'CB' || p.pos === 'DM' ? 0.22 : p.pos === 'GK' ? 0.04 : 0.13);
  stats.yellow = poisson(cardBase * nineties * (p.traits.includes('hothead') ? 1.9 : 1));
  stats.red = chance(clamp(nineties * 0.006 * (p.traits.includes('hothead') ? 3 : 1), 0, 0.5)) ? 1 : 0;

  /* --- nota media --- */
  let rating = 6.35 + (p.ovr - club.str) * 0.028 + (mods.rating || 0);
  if (p.pos === 'GK') rating += (stats.cs / Math.max(1, apps)) * 1.5 - (stats.conceded / Math.max(1, nineties)) * 0.28;
  else rating += ((stats.goals + stats.assists * 0.75) / Math.max(1, nineties)) * 1.15;
  rating += gauss(0, 0.16, -0.5, 0.5) + p.form / 400;
  rating = clamp(rating, 5.1, 9.4);
  stats.rating = Math.round(rating * 100) / 100;
  stats.motm = poisson(clamp((rating - 6.5), 0, 3) * apps * 0.075);

  /* --- clasificacion y titulos --- */
  const boost = { clubId: club.academy ? club.parent : club.id, pts: playerImpactPoints(p, club, stats) };
  const table = simulateTable(G, lk, club.academy ? null : boost);
  const myRow = table.find((r) => r.club.id === (club.academy ? club.parent : club.id));
  const pos = myRow ? myRow.pos : Math.ceil(table.length / 2);
  rep.table = table; rep.leaguePos = pos;

  const played = mins > 400; // hay que haber jugado para "ganar" un titulo de verdad
  const titles = [];
  if (lg) {
    if (pos === 1) titles.push({ name: lg.tier === 1 ? lg.name : lg.name + ' (ascenso)', icon: '🏆', tier: lg.tier === 1 ? 3 : 2 });
    else if (lg.tier === 2 && pos === 2) titles.push({ name: 'Ascenso directo a ' + (LEAGUES[lg.up] ? LEAGUES[lg.up].name : 'Primera'), icon: '⬆️', tier: 2 });
    else if (lg.tier === 2 && pos >= 3 && pos <= 6 && chance(0.28)) titles.push({ name: 'Ascenso por playoff', icon: '⬆️', tier: 2 });
  }
  // Copa nacional (el filial no la juega)
  if (lg && lg.cup && !club.academy) {
    const pool = CLUBS.filter((c) => c.country === lg.country && LEAGUES[leagueOfClub(G, c)]);
    const cupWinner = pickW(pool, (c) => Math.pow(Math.max(1, c.str - 42), 3.1) * (1 + c.prestige / 160));
    const me = club.academy ? getClub(club.parent) : club;
    if (cupWinner && cupWinner.id === me.id) titles.push({ name: lg.cup, icon: '🥇', tier: 2 });
    else rep.cupRound = roundPhrase(rnd() * (1.05 - clamp(me.str - 55, 0, 35) / 55), false);
  }
  // Supercopa
  if (lg && lg.supercup && chance(0.16 + clamp((club.prestige - 70) / 130, 0, 0.3))) {
    if (club.prestige > 70 && chance(0.5)) titles.push({ name: lg.supercup, icon: '🛡️', tier: 1 });
  }
  // Continental (el filial no la juega)
  if (euroTier && !club.academy) {
    const contName = contCompName(club.confed, euroTier);
    const poolIds = (G.euroPool && G.euroPool[euroTier]) || [];
    const pool = poolIds.map(getClub).filter(Boolean);
    const me = club.academy ? getClub(club.parent) : club;
    if (pool.length) {
      const winner = pickW(pool, (c) => Math.pow(Math.max(1, c.str - 55), 3.4) * (1 + c.prestige / 130));
      if (winner && winner.id === me.id) titles.push({ name: contName, icon: euroTier === 'ucl' ? '🏆' : '🏅', tier: euroTier === 'ucl' ? 4 : 2 });
      else {
        const rank = pool.filter((c) => c.str > me.str).length / Math.max(1, pool.length);
        rep.contRound = roundPhrase(clamp(rank + rf(-0.18, 0.3), 0.03, 1), true);
        rep.contName = contName;
      }
    }
  }
  // en la cantera no ganas los titulos del primer equipo
  if (!played || club.academy) titles.length = 0;
  if (club.academy) {
    rep.youthNote = pos <= 3
      ? `El primer equipo del ${getClub(club.parent).name} pelea arriba, pero tú todavía lo ves desde el filial.`
      : `Otro año de formación en la cantera del ${getClub(club.parent).name}.`;
  }
  rep.titles = titles;

  /* --- desarrollo --- */
  const dev = developPlayer(G, stats, { pos, titles, mins, apps });
  rep.dev = dev;

  /* --- descenso / ascenso del club --- */
  rep.relegated = false; rep.promoted = false;
  if (lg && lg.tier === 1 && lg.down) {
    const nRel = RELEGATION[lk] != null ? RELEGATION[lk] : 3;
    if (nRel > 0 && pos > table.length - nRel) rep.relegated = true;
  }
  if (lg && lg.tier === 2 && titles.some((t) => /[Aa]scenso/.test(t.name) || t.name === lg.name)) rep.promoted = true;

  rep.stats = stats;
  rep.injuries = injuries;
  rep.club = club; rep.league = lg; rep.euroTier = euroTier;
  rep.fixtures = fx;
  rep.role = role;
  return rep;
}

function contCompName(confed, tier) {
  const c = CONTINENTAL[confed] || CONTINENTAL.UEFA;
  if (tier === 'ucl' || tier === 'cont') return c.elite;
  if (tier === 'uel') return c.second || c.elite;
  return c.third || c.second || c.elite;
}

/* ---------- Evolucion del jugador ---------- */
const AGE_GROWTH = { 16: 1.00, 17: 1.00, 18: 0.96, 19: 0.90, 20: 0.84, 21: 0.78, 22: 0.70, 23: 0.61, 24: 0.52, 25: 0.43, 26: 0.34, 27: 0.25, 28: 0.17, 29: 0.11, 30: 0.06 };

function developPlayer(G, stats, ctx) {
  const p = G.player;
  const mods = G.mods;
  const before = p.ovr;

  const minutesF = clamp(0.28 + (stats.mins / 2100) * 0.9, 0.28, 1.28);
  let ageF = AGE_GROWTH[p.age] != null ? AGE_GROWTH[p.age] : 0;
  if (p.traits.includes('wonderkid') && p.age <= 22) ageF *= 1.25;
  if (p.traits.includes('latebloomer') && p.age >= 25) ageF = Math.max(ageF, 0.36 - (p.age - 25) * 0.04);

  const gap = Math.max(0, p.pot - p.ovr);
  let growth = ageF * gap * 0.225 * minutesF * (mods.growth || 1) * rf(0.72, 1.3);

  // rendimiento por encima de lo esperado acelera; jugar mal frena
  const perf = (stats.rating - 6.6) * 1.3;
  growth += clamp(perf, -1.2, 1.6) * (p.age <= 26 ? 0.55 : 0.3);
  // entrenar en un club grande ayuda
  growth *= 0.9 + clamp((G.club.str - 60) / 130, -0.1, 0.32);

  // declive
  let decline = 0;
  const declineAge = 29 + (p.pos === 'GK' ? 4 : p.pos === 'CB' || p.pos === 'DM' ? 2 : 0) + (p.traits.includes('professor') ? 2 : 0);
  if (p.age > declineAge) {
    decline = (p.age - declineAge) * 0.92 + rf(0, 1.2);
    if (stats.mins > 1800) decline *= 0.8;
    if (p.attrs.phy != null) decline *= 1 + (60 - clamp(p.attrs.phy, 30, 99)) / 200;
  }
  // lesiones graves pasan factura
  const badInj = (G.lastInjurySev || 0);
  if (badInj >= 3) decline += badInj === 4 ? rf(1.2, 3.4) : rf(0.4, 1.4);

  let delta = clamp(growth - decline, -7, 7.5);
  if (p.age <= 20) delta = Math.max(delta, -1.5);

  // repartir en atributos
  const list = attrsFor(p.pos);
  const w = WEIGHTS[p.pos];
  const totalPts = delta * 6.2;
  let assigned = 0;
  const order = shuffle(list.slice());
  order.forEach((a) => {
    const share = (w[a.key] || 0.05) + rf(-0.03, 0.05);
    let v = totalPts * share;
    assigned += v;
    p.attrs[a.key] = clamp(Math.round((p.attrs[a.key] + v) * 10) / 10, 22, 99);
  });
  p.ovr = computeOvr(p);
  // asegurar coherencia con el delta calculado
  const drift = (before + delta) - p.ovr;
  if (Math.abs(drift) >= 1) {
    const k = pickW(list, (a) => (w[a.key] || 0.05));
    p.attrs[k.key] = clamp(p.attrs[k.key] + drift, 22, 99);
    p.ovr = computeOvr(p);
  }

  // puntos de entrenamiento para gastar a mano
  let sp = 2;
  if (p.age <= 21) sp += 2;
  else if (p.age <= 26) sp += 1;
  if (stats.mins > 2300) sp += 1;
  if (stats.rating >= 7.3) sp += 1;
  if (ctx.titles.length) sp += 1;
  if (p.age >= 31) sp = Math.max(1, sp - 2);   // a partir de cierta edad ya no se aprende igual
  p.sp += sp;

  return { before, after: p.ovr, delta: p.ovr - before, sp, growthRaw: growth, decline };
}

/* ---------- Actualizar el mundo tras la temporada ----------
   `cache` permite reutilizar la clasificacion que ya ha visto el jugador,
   para que lo que pasa en su liga sea coherente con su resumen de temporada. */
function advanceWorld(G, cache) {
  cache = cache || {};
  const tableFor = (lk) => (cache[lk] && cache[lk].length ? cache[lk] : simulateTable(G, lk));
  const done = {};
  for (const lk in LEAGUES) {
    const lg = LEAGUES[lk];
    if (lg.tier !== 1 || !lg.down || done[lk]) continue;
    const nRel = RELEGATION[lk] != null ? RELEGATION[lk] : 3;
    if (!nRel) continue;
    const t1 = tableFor(lk), t2 = tableFor(lg.down);
    if (!t1.length || !t2.length) continue;
    const down = t1.slice(-nRel).map((r) => r.club);
    const up = t2.slice(0, nRel).map((r) => r.club);
    down.forEach((c) => { G.world[c.id] = lg.down; });
    up.forEach((c) => { G.world[c.id] = lk; });
    done[lk] = done[lg.down] = true;
  }
  computeEuroSpots(G, cache);
}

/* ---------- Plazas continentales ---------- */
function computeEuroSpots(G, cache) {
  cache = cache || {};
  G.euro = {}; G.euroPool = { ucl: [], uel: [], uecl: [], cont: [] };
  for (const lk in LEAGUES) {
    const lg = LEAGUES[lk];
    if (lg.tier !== 1) continue;
    const country = COUNTRY_BY_CODE[lg.country];
    const confed = country ? country.confed : 'UEFA';
    const table = (cache[lk] && cache[lk].length) ? cache[lk] : simulateTable(G, lk);
    if (!table.length) continue;
    if (confed === 'UEFA') {
      let i = 0;
      for (let n = 0; n < lg.ucl && i < table.length; n++, i++) { G.euro[table[i].club.id] = 'ucl'; G.euroPool.ucl.push(table[i].club.id); }
      for (let n = 0; n < lg.uel && i < table.length; n++, i++) { G.euro[table[i].club.id] = 'uel'; G.euroPool.uel.push(table[i].club.id); }
      for (let n = 0; n < lg.uecl && i < table.length; n++, i++) { G.euro[table[i].club.id] = 'uecl'; G.euroPool.uecl.push(table[i].club.id); }
    } else {
      const slots = CONT_SLOTS[lk] || 0;
      for (let i = 0; i < slots && i < table.length; i++) { G.euro[table[i].club.id] = 'cont'; G.euroPool.cont.push(table[i].club.id); }
    }
  }
}

/* ---------- Objetivos de temporada ---------- */
function makeObjectives(G) {
  const p = G.player, club = G.club, lg = LEAGUES[leagueOfClub(G, club)];
  const role = squadRole(p, club, competitorGap(G));
  const objs = [];
  const expMins = Math.round(role.min * 34 * 78);
  objs.push({ id: 'mins', text: `Jugar más de ${Math.round(expMins / 90)} partidos completos`, target: expMins, kind: 'mins', reward: 1 });
  if (p.pos === 'GK') {
    objs.push({ id: 'cs', text: `Dejar la portería a cero ${Math.max(4, Math.round(role.min * 12))} veces`, target: Math.max(4, Math.round(role.min * 12)), kind: 'cs', reward: 2 });
  } else if (['ST', 'LW', 'RW', 'AM'].includes(p.pos)) {
    const t = Math.max(3, Math.round(POS_BY_KEY[p.pos].g * (expMins / 90) * Math.pow(p.ovr / 75, 2.2)));
    objs.push({ id: 'goals', text: `Marcar ${t} goles`, target: t, kind: 'goals', reward: 2 });
  } else {
    const t = Math.max(2, Math.round(POS_BY_KEY[p.pos].a * (expMins / 90) * Math.pow(p.ovr / 75, 2)) + 1);
    objs.push({ id: 'assists', text: `Repartir ${t} asistencias`, target: t, kind: 'assists', reward: 2 });
  }
  if (lg && lg.tier === 1 && club.str > 76) objs.push({ id: 'pos', text: 'Clasificar al equipo para Europa', target: 6, kind: 'pos', reward: 2 });
  else if (lg && lg.tier === 2) objs.push({ id: 'pos', text: 'Pelear el ascenso (top 6)', target: 6, kind: 'pos', reward: 2 });
  else objs.push({ id: 'rating', text: 'Terminar con una nota media de 7.0', target: 7.0, kind: 'rating', reward: 2 });
  return objs;
}
function checkObjectives(G, rep) {
  const s = rep.stats;
  return (G.objectives || []).map((o) => {
    let val;
    if (o.kind === 'mins') val = s.mins;
    else if (o.kind === 'pos') val = rep.leaguePos;
    else if (o.kind === 'rating') val = s.rating;
    else val = s[o.kind] || 0;
    const ok = o.kind === 'pos' ? val <= o.target : val >= o.target;
    return { ...o, val, ok };
  });
}

/* ---------- Sueldos ---------- */
function wageFor(club, p, roleKey) {
  const roleMul = { star: 1.45, key: 1.15, starter: 1.0, rot: 0.75, sub: 0.55, fringe: 0.4 }[roleKey] || 1;
  const base = Math.pow(clamp(club.str, 35, 95) / 60, 3.4) * Math.pow(clamp(p.ovr, 40, 99) / 70, 4) * 0.6;
  const ageMul = p.age <= 19 ? 0.35 : p.age <= 22 ? 0.65 : p.age >= 34 ? 0.8 : 1;
  const repMul = 1 + p.rep / 300 + (p.traits.includes('mediastar') ? 0.18 : 0);
  return Math.max(0.02, base * roleMul * ageMul * repMul * rf(0.9, 1.12));
}

/* ---------- Afinidad de un pais con una liga ---------- */
function countryAffinity(country, clubCountry) {
  if (country.code === clubCountry) return 100;
  if (country.links.includes(clubCountry)) return 14;
  const cc = COUNTRY_BY_CODE[clubCountry];
  if (cc && cc.confed === country.confed) return 5;
  return 1.1;
}

/* ---------- Opciones al empezar (16 anios) ---------- */
function startingOptions(G) {
  const p = G.player;
  const country = COUNTRY_BY_CODE[p.country];
  const homeLeagues = Object.values(LEAGUES).filter((l) => l.country === country.code);
  const hasHome = homeLeagues.length > 0;

  // Cuanto se te ve el talento con 16: no es tu potencial real, es lo que aparenta
  const visible = p.ovr + (p.pot - p.ovr) * rf(0.15, 0.45) + rf(-3, 4);
  const options = [];

  // -- Opcion 1: cantera de un club grande --
  const bigPool = CLUBS.filter((c) => {
    const lg = LEAGUES[c.league];
    if (!lg || lg.tier !== 1) return false;
    if (c.prestige < 62) return false;
    return countryAffinity(country, c.country) >= (hasHome ? 100 : 5);
  });
  // salir de un pais sin liga profesional modelada cuesta mas: menos ojeadores, menos contactos
  const exile = hasHome ? 0 : (country.tier - 2) * 3.5;
  const big = bigPool.length ? pickW(bigPool, (c) => {
    const aff = countryAffinity(country, c.country);
    // cuanto mas grande el club, mas dificil entrar; el talento visible abre puertas
    const reach = Math.exp(-(c.prestige - 58 + exile - (visible - 52) * 1.5) / 13);
    return aff * clamp(reach, 0.01, 8);
  }) : null;
  if (big) {
    options.push({
      kind: 'academy', club: academyOf(big), parent: big,
      title: 'Cantera del ' + big.name,
      desc: big.prestige >= 84
        ? 'Te ficha uno de los grandes de Europa. Formación de élite, pero hay cuarenta chavales más peleando por tu puesto.'
        : big.prestige >= 70
          ? 'Un club de Primera con una cantera seria. Se sale de aquí, pero hay que ganárselo.'
          : 'Un club de Primera modesto te mete en su cantera. No es el Madrid, pero es Primera.',
      pros: ['Mejor formación', 'Escaparate mundial'], cons: ['Muchísima competencia', 'Pocos minutos al principio'],
      dev: 1.18, minsMod: 0.72,
    });
  }

  // -- Opcion 2: primer equipo de un club modesto (mas minutos) --
  const modestPool = CLUBS.filter((c) => {
    const lg = LEAGUES[c.league];
    if (!lg) return false;
    if (c.str > clamp(visible + 16, 52, 70)) return false;
    return countryAffinity(country, c.country) >= (hasHome ? 100 : 5);
  });
  const modest = modestPool.length ? pickW(modestPool, (c) => {
    const lg = LEAGUES[c.league];
    return countryAffinity(country, c.country) * (lg.tier === 2 ? 3 : 1) * (1 / (1 + Math.abs(c.str - visible - 8) / 6));
  }) : null;
  if (modest) {
    options.push({
      kind: 'first', club: modest, parent: null,
      title: modest.name,
      desc: `Te suben al primer equipo. Nivel más bajo, pero vas a jugar de verdad desde el primer día.`,
      pros: ['Minutos garantizados', 'Debut temprano'], cons: ['Entorno menos exigente', 'Menos escaparate'],
      dev: 0.95, minsMod: 1.2,
    });
  }

  // -- Opcion 3: salir fuera --
  const abroadPool = CLUBS.filter((c) => {
    if (c.country === country.code) return false;
    const lg = LEAGUES[c.league];
    if (!lg) return false;
    const aff = countryAffinity(country, c.country);
    if (aff < 5) return false;
    return c.str <= clamp(visible + 26, 60, 88);
  });
  const abroad = abroadPool.length ? pickW(abroadPool, (c) => {
    const aff = countryAffinity(country, c.country);
    const lg = LEAGUES[c.league];
    const reach = Math.exp(-(c.prestige - 52 - (visible - 52) * 1.6) / 15);
    return aff * clamp(reach, 0.01, 6) * (lg.rep / 70);
  }) : null;
  if (abroad) {
    const useAcademy = abroad.prestige > 62 || chance(0.5);
    options.push({
      kind: useAcademy ? 'academy' : 'first',
      club: useAcademy ? academyOf(abroad) : abroad, parent: useAcademy ? abroad : null,
      title: (useAcademy ? 'Cantera del ' : '') + abroad.name,
      desc: `Hacer las maletas con 16 años. ${COUNTRY_BY_CODE[abroad.country].flag} ${COUNTRY_BY_CODE[abroad.country].name}, lejos de casa, todo por descubrir.`,
      pros: ['Liga más potente', 'Salto de nivel'], cons: ['Adaptación dura', 'Sin red de seguridad'],
      dev: 1.08, minsMod: 0.85, abroad: true,
    });
  }

  // Rellenar si falta alguna
  while (options.length < 3) {
    const c = pickW(CLUBS.filter((x) => LEAGUES[x.league] && x.str < visible + 18), (x) => countryAffinity(country, x.country));
    if (!c) break;
    if (options.some((o) => (o.parent || o.club).name === c.name)) continue;
    options.push({
      kind: 'first', club: c, parent: null, title: c.name,
      desc: 'Una oportunidad inesperada. Nadie apostaba por ti aquí.',
      pros: ['Sitio libre en la plantilla'], cons: ['Proyecto sin garantías'],
      dev: 1.0, minsMod: 1.05,
    });
  }
  return options.slice(0, 3);
}

/* ---------- Interes de un club por el jugador ---------- */
function clubInterest(G, club, ctx) {
  const p = G.player;
  const lg = LEAGUES[leagueOfClub(G, club)];
  if (!lg) return 0;
  const cur = G.club;
  if (cur && (club.id === cur.id || (cur.parent && club.id === cur.parent))) return 0;

  const gap = p.ovr - club.str;
  let s;
  if (gap >= 0) s = 100 - Math.max(0, gap - 7) * 7;     // mejor que ellos: les encanta, pero no pueden pagarlo si les sacas mucho
  else s = 78 + gap * 8;                                 // por debajo de su nivel: menos interes
  if (p.age <= 21 && p.pot - p.ovr >= 6) s += 22 + (p.pot - p.ovr);
  if (p.age <= 18) s -= 8;
  if (p.age >= 31) s -= (p.age - 30) * 13;
  if (p.age >= 35) s -= 30;
  // pasados los 34, nadie ficha a alguien por debajo de su nivel
  if (p.age >= 34 && p.ovr < club.str - 3) return 0;
  s += (p.rep - 30) * 0.28;
  s += ((ctx.rating || 6.6) - 6.6) * 34;
  s += ((ctx.goals || 0) + (ctx.assists || 0) * 0.7) * 1.1;
  if (ctx.mins < 500) s -= 22;
  if (p.injuryHistory >= 3) s -= 8;
  if (p.traits.includes('hothead')) s -= 5;
  if (p.traits.includes('mediastar')) s += 6;

  // los clubes de ligas fuertes son mas exigentes
  s -= Math.max(0, lg.rep - 78) * 0.5;
  // afinidad cultural / scouting
  const country = COUNTRY_BY_CODE[p.country];
  s += Math.log10(countryAffinity(country, club.country)) * 6;
  // salto de liga: no se pasa de la nada a la Premier de un verano para otro
  const curLg = cur ? LEAGUES[leagueOfClub(G, cur)] : null;
  if (curLg) s -= Math.max(0, lg.rep - curLg.rep - 10) * 1.9;
  // si acabas de llegar, ni el club te vende ni nadie se molesta en preguntar
  if ((p.seasonsAtClub || 0) < 1) s -= 16;
  return clamp(s, 0, 130);
}

/* ---------- Generar opciones de mercado tras la temporada ---------- */
function generateMarket(G, rep) {
  const p = G.player;
  const cur = G.club;
  const s = rep.stats;
  const ctx = { rating: s.rating, goals: s.goals, assists: s.assists, mins: s.mins };
  const opts = [];

  /* ¿Te quiere tu club? */
  const role = squadRole(p, cur, competitorGap(G));
  const parentClub = cur.academy ? getClub(cur.parent) : cur;
  let clubWants = true;
  if (cur.academy) {
    // ¿te suben al primer equipo?
    const readiness = p.ovr - parentClub.str;
    if (readiness >= -8 || (p.age >= 19 && readiness >= -13)) {
      opts.push({
        type: 'promote', club: parentClub,
        title: 'Subir al primer equipo del ' + parentClub.name,
        desc: 'El club te sube. Se acabó la cantera: ahora te mides con los mayores.',
        wage: wageFor(parentClub, p, squadRole(p, parentClub).key), years: ri(3, 5),
        tags: ['Sueño cumplido', squadRole(p, parentClub).name],
      });
    } else if (p.age >= 19) {
      clubWants = false;
    } else {
      opts.push({
        type: 'stay', club: cur, title: 'Seguir en la cantera del ' + parentClub.name,
        desc: 'Un año más de formación. Todavía no te ven listo.',
        wage: Math.max(0.03, wageFor(cur, p, role.key) * 0.5), years: 1, tags: ['Paciencia'],
      });
    }
  } else {
    const keepScore = (p.ovr - cur.str) * 6 + (s.rating - 6.5) * 40 + (p.age <= 26 ? 15 : p.age >= 34 ? -30 : 0) + (s.mins > 900 ? 12 : -14);
    clubWants = keepScore > -20;
    if (clubWants) {
      const nr = squadRole(p, cur);
      opts.push({
        type: 'stay', club: cur,
        title: 'Renovar con el ' + cur.name,
        desc: p.contract <= 1 ? 'El club te pone un contrato nuevo sobre la mesa.' : 'Sigues bajo contrato. Un año más en casa.',
        wage: wageFor(cur, p, nr.key) * (p.traits.includes('loyal') ? 1.06 : 1),
        years: p.age >= 33 ? 1 : ri(2, 4), tags: [nr.name, 'Continuidad'],
      });
    }
  }

  /* Ofertas de fuera */
  const pool = CLUBS.filter((c) => {
    const lg = LEAGUES[leagueOfClub(G, c)];
    if (!lg) return false;
    return Math.abs(c.str - p.ovr) < 26;
  });
  const scored = [];
  for (const c of pool) {
    const it = clubInterest(G, c, ctx);
    if (it > 46) scored.push({ club: c, it: it * rf(0.7, 1.35) });
  }
  scored.sort((a, b) => b.it - a.it);

  // variedad: como mucho un club por liga
  const seenLeague = {};
  const picks = [];
  for (const sc of scored) {
    const lk = leagueOfClub(G, sc.club);
    if (seenLeague[lk]) continue;
    seenLeague[lk] = 1; picks.push(sc);
    if (picks.length >= 6) break;
  }
  const nOffers = clamp(Math.round(picks.length ? gauss(2.1, 1, 0, 3) : 0), 0, 3);
  shuffle(picks).slice(0, nOffers).forEach((sc) => {
    const c = sc.club;
    const nr = squadRole(p, c);
    const lg = LEAGUES[leagueOfClub(G, c)];
    opts.push({
      type: 'transfer', club: c,
      title: 'Fichar por el ' + c.name,
      desc: offerFlavour(G, c, nr),
      wage: wageFor(c, p, nr.key), years: p.age >= 32 ? ri(1, 2) : ri(3, 5),
      tags: [lg.name, nr.name, c.prestige > 80 ? 'Club histórico' : lg.tier === 2 ? 'Segunda división' : 'Primera división'],
      fee: playerValue(p) * rf(0.85, 1.6),
    });
  });

  /* Cesion si no juegas y eres joven */
  if (p.age <= 23 && s.mins < 900 && !cur.academy) {
    const loanPool = CLUBS.filter((c) => {
      const lg = LEAGUES[leagueOfClub(G, c)];
      return lg && c.str < p.ovr + 5 && c.str > p.ovr - 14 && c.id !== cur.id;
    });
    if (loanPool.length) {
      const lc = pickW(loanPool, (c) => countryAffinity(COUNTRY_BY_CODE[p.country], c.country) * (1 / (1 + Math.abs(c.str - p.ovr + 4) / 5)));
      opts.push({
        type: 'loan', club: lc, backTo: cur.id,
        title: 'Cesión al ' + lc.name,
        desc: 'Un año fuera para jugar. Si respondes, vuelves con otro cartel.',
        wage: wageFor(lc, p, 'starter') * 0.7, years: 1,
        tags: ['Cesión', 'Minutos asegurados'],
      });
    }
  }

  /* Si nadie te quiere: queda alguna puerta de servicio, pero no siempre */
  const stillWorthIt = p.age <= 33 || p.ovr >= 66 || chance(clamp(0.75 - (p.age - 33) * 0.18, 0, 0.75));
  if (!opts.length && stillWorthIt) {
    const desperate = CLUBS.filter((c) => {
      const lg = LEAGUES[leagueOfClub(G, c)];
      return lg && c.str <= p.ovr + 2 && c.str >= p.ovr - 18;
    });
    if (desperate.length) {
      const c = pickW(desperate, (x) => countryAffinity(COUNTRY_BY_CODE[p.country], x.country) / (1 + Math.abs(x.str - p.ovr + 6)));
      opts.push({
        type: 'transfer', club: c, title: 'Firmar por el ' + c.name,
        desc: 'La única puerta que sigue abierta. Hay que seguir jugando.',
        wage: wageFor(c, p, 'starter') * 0.8, years: ri(1, 2),
        tags: [LEAGUES[leagueOfClub(G, c)].name, 'Última oportunidad'],
      });
    }
  }

  /* Retirada */
  if (!opts.length) {
    opts.push({
      type: 'retire', club: null, forced: true,
      title: 'Colgar las botas',
      desc: 'No queda ni una oferta sobre la mesa. El teléfono lleva todo el verano sin sonar.',
      tags: ['Sin ofertas'],
    });
  } else if (p.age >= 32) {
    opts.push({
      type: 'retire', club: null,
      title: 'Colgar las botas',
      desc: p.age >= 37 ? 'Ha sido un viaje largo. Retirarte ahora, en tus términos.' : 'Dejarlo ya y empezar otra vida.',
      tags: ['Fin de carrera'],
    });
  }
  return { options: opts, clubWants };
}

function offerFlavour(G, club, role) {
  const lg = LEAGUES[leagueOfClub(G, club)];
  const bits = [];
  if (club.prestige >= 88) bits.push('Uno de los grandes de Europa llama a tu puerta.');
  else if (club.prestige >= 74) bits.push('Un club con historia que quiere volver a lo más alto.');
  else if (lg.tier === 2) bits.push('Proyecto de ascenso: quieren que seas el líder.');
  else bits.push('Un club que te ha seguido toda la temporada.');
  if (role.key === 'star') bits.push('Te quieren como estandarte del equipo.');
  else if (role.key === 'key') bits.push('Titular desde el primer día.');
  else if (role.key === 'rot' || role.key === 'sub') bits.push('Tendrías que pelear un sitio.');
  const eu = G.euro && G.euro[club.id];
  if (eu) bits.push('Juegan ' + contCompName(club.confed, eu) + ' la temporada que viene.');
  return bits.join(' ');
}

/* ---------- Aplicar el movimiento ---------- */
function applyMove(G, opt) {
  const p = G.player;
  if (opt.type === 'retire') { p.retired = true; return; }
  const prev = G.club;
  if (opt.type === 'loan') { p.loanFrom = opt.backTo; }
  else if (p.loanFrom && opt.type !== 'loan') p.loanFrom = null;
  p.seasonsAtClub = (prev && opt.club && prev.id === opt.club.id) ? (p.seasonsAtClub || 0) + 1 : 0;
  G.club = opt.club;
  p.contract = opt.years || 2;
  p.wage = opt.wage || 0.05;
  if (prev && opt.club && prev.id !== opt.club.id) {
    p.trust = clamp(52 + rf(-6, 10), 30, 80);
    p.fanLove = opt.type === 'promote' ? 68 : clamp(50 + rf(-8, 10), 25, 75);
    p.morale = clamp(p.morale + (opt.club.prestige > (prev.prestige || 0) ? 8 : -2), 25, 100);
  }
  p.value = playerValue(p);
}

/* ============================================================
   PREMIOS INDIVIDUALES Y SELECCION NACIONAL
   ============================================================ */

const TITLE_POINTS = {
  'UEFA Champions League': 32, 'Copa Libertadores': 22, 'Concacaf Champions Cup': 10,
  'AFC Champions League Elite': 10, 'UEFA Europa League': 12, 'Copa Sudamericana': 8,
  'UEFA Conference League': 6, 'Mundial': 42, 'Eurocopa': 26, 'Copa América': 24,
  'Copa Africana de Naciones': 14, 'Copa Oro': 8, 'Copa Asiática': 8,
};
function titlePoints(name, leagueName) {
  if (TITLE_POINTS[name]) return TITLE_POINTS[name];
  if (name === leagueName) return 14;
  if (/[Aa]scenso/.test(name)) return 3;
  if (/Copa|Cup|Pokal/.test(name)) return 6;
  if (/Supercopa|Shield|Campeones/.test(name)) return 3;
  return 4;
}

/* ---------- Premios de la temporada ---------- */
function computeAwards(G, rep) {
  const p = G.player;
  const s = rep.stats;
  const lg = rep.league;
  const club = rep.club;
  const out = [];
  if (s.mins < 700 || club.academy) return out;

  const lw = clamp((lg ? lg.rep : 65) / 88, 0.5, 1.15);        // peso de la liga
  const ga = s.goals + s.assists * 0.75;

  /* Máximo goleador de la liga */
  if (p.pos !== 'GK') {
    const need = Math.round(gauss(9 + lw * 14, 2.6, 8, 34));
    if (s.goals >= need && s.goals >= 12) {
      out.push({ name: 'Máximo goleador de ' + (lg ? lg.name : 'la liga'), icon: '👟', kind: 'boot', pts: 8 });
    }
    const needA = Math.round(gauss(8 + lw * 5, 2, 6, 20));
    if (s.assists >= needA && s.assists >= 9) {
      out.push({ name: 'Máximo asistente de ' + (lg ? lg.name : 'la liga'), icon: '🎩', kind: 'assist', pts: 6 });
    }
  }

  /* Portero menos goleado */
  if (p.pos === 'GK' && s.cs >= Math.round(gauss(13, 2.4, 9, 22)) && s.apps >= 25) {
    out.push({ name: 'Zamora / portero menos goleado', icon: '🧤', kind: 'gk', pts: 7 });
  }

  /* MVP de la liga */
  const mvpScore = (p.ovr - 76) * 3 + ga * 1.4 * lw + (rep.leaguePos <= 2 ? 16 : rep.leaguePos <= 5 ? 7 : 0) + (s.rating - 7) * 26;
  if (mvpScore >= gauss(62, 9, 42, 92) && p.ovr >= 82) {
    out.push({ name: 'MVP de ' + (lg ? lg.name : 'la liga'), icon: '⭐', kind: 'mvp', pts: 11 });
  }

  /* Once ideal */
  if (mvpScore >= gauss(40, 8, 24, 64) && p.ovr >= 78) {
    out.push({ name: 'Once ideal de ' + (lg ? lg.name : 'la liga'), icon: '🧩', kind: 'toty', pts: 5 });
  }

  /* Mejor joven */
  if (p.age <= 21 && mvpScore >= gauss(20, 6, 10, 40)) {
    out.push({ name: 'Mejor jugador joven de ' + (lg ? lg.name : 'la liga'), icon: '🌟', kind: 'young', pts: 5 });
  }
  if (p.age <= 21 && p.ovr >= 82 && mvpScore >= gauss(42, 8, 26, 70)) {
    out.push({ name: 'Golden Boy', icon: '🏅', kind: 'goldenboy', pts: 12 });
  }

  /* Puskás */
  if (s.goals >= 8 && chance(0.05 + Math.min(0.09, s.goals / 400))) {
    out.push({ name: 'Premio Puskás al mejor gol', icon: '🎬', kind: 'puskas', pts: 5 });
  }

  /* Balón de Oro */
  let ballon = 0;
  ballon += (p.ovr - 84) * 3;
  ballon += ga * 1.25 * lw;
  ballon += (s.rating - 7) * 20;
  (rep.titles || []).forEach((t) => { ballon += titlePoints(t.name, lg ? lg.name : '') * 0.95; });
  (rep.ntTitles || []).forEach((t) => { ballon += titlePoints(t.name, '') * 1.0; });
  ballon += clamp((club.prestige - 78) * 0.35, 0, 8);
  ballon += clamp((p.rep - 60) * 0.2, 0, 10);
  if (p.pos === 'GK') ballon *= 0.55;
  if (p.pos === 'CB' || p.pos === 'DM' || p.pos === 'LB' || p.pos === 'RB') ballon *= 0.78;
  rep.ballonScore = Math.round(ballon);

  const threshold = gauss(134, 11, 105, 165);
  if (p.ovr >= 88 && ballon >= threshold) {
    out.push({ name: 'BALÓN DE ORO', icon: '🥇', kind: 'ballon', pts: 40 });
  } else if (p.ovr >= 85 && ballon >= threshold - 26) {
    out.push({ name: 'Podio del Balón de Oro (' + (ballon >= threshold - 12 ? '2º' : '3º') + ')', icon: '🥈', kind: 'ballon3', pts: 14 });
  } else if (p.ovr >= 82 && ballon >= threshold - 52) {
    out.push({ name: 'Nominado al Balón de Oro', icon: '📜', kind: 'ballonNom', pts: 5 });
  }

  return out;
}

/* ---------- Seleccion nacional ---------- */
const NT_THRESHOLD = { 1: 83.5, 2: 78.5, 3: 74, 4: 70, 5: 66, 6: 61 };

function ntEvaluate(G, rep) {
  const p = G.player;
  const country = COUNTRY_BY_CODE[p.country];
  const lg = rep.league;
  const s = rep.stats;
  const res = { called: false, level: null, caps: 0, goals: 0, tournaments: [], titles: [], feed: [] };

  // La media manda. Todo lo demas son ajustes pequenios: el tope del bono es +6.
  let bonus = 0;
  bonus += clamp(((lg ? lg.rep : 60) - 74) * 0.09, -3, 2);
  bonus += clamp((s.rating - 6.8) * 4, -5, 4);
  bonus += Math.min(3, s.goals * (p.pos === 'GK' ? 0 : 0.14) + s.assists * 0.1);
  bonus += clamp((p.rep - 50) * 0.03, -1.5, 2);
  if (p.nt.streak > 0) bonus += 1.5;                          // ya eres del grupo
  if (p.traits.includes('leader')) bonus += 0.5;
  if (s.mins < 800) bonus -= 8;
  if (p.age >= 33) bonus -= (p.age - 32) * 2.4;
  const score = p.ovr + clamp(bonus, -16, 6);

  const th = NT_THRESHOLD[country.tier];

  /* categorias inferiores */
  if (p.age <= 21) {
    const youthTh = th - (p.age <= 17 ? 16 : p.age <= 19 ? 12 : 8);
    if (score >= youthTh) {
      const lvl = p.age <= 17 ? 'Sub-17' : p.age <= 19 ? 'Sub-19' : 'Sub-21';
      res.called = true; res.level = lvl;
      res.caps = ri(3, 9);
      res.goals = p.pos === 'GK' ? 0 : poisson(POS_BY_KEY[p.pos].g * res.caps * 0.85);
      res.feed.push({ icon: '🌱', cls: 'info', text: `Convocado con la selección ${country.flag} ${lvl}. ${res.caps} partidos, ${res.goals} goles.` });
    }
  }

  /* absoluta */
  if (score >= th && p.age >= 17) {
    res.called = true; res.level = 'Absoluta';
    p.nt.streak++;
    res.caps = ri(5, 13);
    res.goals = p.pos === 'GK' ? 0 : poisson(POS_BY_KEY[p.pos].g * res.caps * 0.75);
    if (p.nt.caps === 0) res.feed.push({ icon: '🎽', cls: 'gold', text: `¡DEBUT ABSOLUTO con ${country.flag} ${country.name}! Un día que no se olvida.` });
    res.feed.push({ icon: '🌐', cls: 'info', text: `${res.caps} internacionalidades esta temporada con ${country.flag} ${country.name}${res.goals ? ` y ${res.goals} gol${res.goals > 1 ? 'es' : ''}` : ''}.` });
  } else if (p.nt.streak > 0 && res.level !== 'Absoluta') {
    p.nt.streak = 0;
    if (p.nt.caps > 0) res.feed.push({ icon: '📉', cls: 'bad', text: `Te quedas fuera de la lista de ${country.flag} ${country.name}.` });
  }

  /* torneos del verano */
  const year = G.seasonStart + 1;
  if (res.level === 'Absoluta') {
    tournamentsInYear(year, country.confed).forEach((t) => {
      const r = simulateNTTournament(G, t, country, p);
      res.tournaments.push(r);
      if (r.won) res.titles.push({ name: t.name, icon: t.emoji, tier: t.prestige >= 88 ? 4 : 3, nt: true });
      res.feed.push({
        icon: t.emoji, cls: r.won ? 'gold' : r.stage === 'subcampeón' ? 'info' : 'info',
        text: `${t.name}: ${country.flag} ${country.name} ${stagePhrase(r.stage)}. ${r.caps} partidos, ${r.goals} goles${r.motm ? `, ${r.motm} MVP` : ''}.`,
      });
    });
  } else if (p.age <= 23 && res.called) {
    youthTournamentsInYear(year, country.confed).filter((t) => p.age <= t.maxAge).forEach((t) => {
      if (!chance(0.6)) return;
      const won = chance(0.10 + (6 - country.tier) * 0.02);
      res.feed.push({ icon: t.emoji, cls: won ? 'gold' : 'info', text: `${t.name}: ${won ? '¡CAMPEÓN!' : roundPhrase(rnd(), true)}.` });
      if (won) res.titles.push({ name: t.name, icon: t.emoji, tier: 2, nt: true });
    });
  }

  return res;
}

const CONFED_FLOOR = { UEFA: 1, CONMEBOL: 1, CONCACAF: 2, CAF: 2, AFC: 2, OFC: 5 };
function simulateNTTournament(G, t, country, p) {
  const isWorld = t.confed === '*';
  const tierRel = isWorld ? country.tier : clamp(country.tier - (CONFED_FLOOR[country.confed] || 1) + 1, 1, 6);
  const baseWin = isWorld
    ? [0.075, 0.022, 0.008, 0.003, 0.0010, 0.0003][tierRel - 1]
    : [0.21, 0.12, 0.058, 0.024, 0.009, 0.003][tierRel - 1];
  // un crack arrastra a su seleccion, pero no la gana el solo
  const boost = 1 + clamp((p.ovr - 84) * 0.035, 0, 0.5) + (p.traits.includes('clutch') ? 0.1 : 0);
  const win = clamp(baseWin * boost, 0.0004, 0.6);
  const roll = rnd();
  let stage;
  if (roll < win) stage = 'campeón';
  else if (roll < win * 2.1) stage = 'subcampeón';
  else if (roll < win * 4.2) stage = 'semifinalista';
  else if (roll < win * 8) stage = 'cuartofinalista';
  else if (roll < win * 15 + 0.12) stage = 'eliminado en octavos';
  else stage = 'eliminado en la fase de grupos';
  const caps = stage === 'campeón' || stage === 'subcampeón' ? ri(6, 7)
    : stage.includes('semi') ? ri(5, 6) : stage.includes('cuartos') ? ri(4, 5)
      : stage.includes('octavos') ? ri(3, 4) : ri(2, 3);
  const goals = p.pos === 'GK' ? 0 : poisson(POS_BY_KEY[p.pos].g * caps * Math.pow(p.ovr / 78, 2));
  const motm = poisson(clamp((p.ovr - 80) / 22, 0, 1) * caps * 0.25);
  return { stage, won: stage === 'campeón', caps, goals, motm, name: t.name, prestige: t.prestige };
}

/* ---------- Reputacion ---------- */
function updateReputation(G, rep, awards, nt) {
  const p = G.player;
  const s = rep.stats;
  let d = 0;
  d += clamp((s.rating - 6.6) * 6, -6, 9);
  d += Math.min(10, (s.goals + s.assists * 0.6) * 0.35);
  d += (rep.titles || []).reduce((a, t) => a + titlePoints(t.name, rep.league ? rep.league.name : '') * 0.22, 0);
  d += awards.reduce((a, x) => a + x.pts * 0.55, 0);
  d += (nt.level === 'Absoluta' ? 3 : nt.level ? 1 : 0);
  d += clamp((p.ovr - 74) * 0.35, -3, 6);
  d += clamp(((rep.league ? rep.league.rep : 60) - 72) * 0.05, -2, 2);
  if (s.mins < 500) d -= 6;
  if (p.traits.includes('mediastar')) d *= 1.2;
  // la fama se evapora: cuanto mas lejos estas de tu mejor version, mas rapido te olvidan
  const fade = 1.2 + Math.max(0, (p.peakOvr || p.ovr) - p.ovr) * 0.55 + Math.max(0, p.age - 31) * 0.6;
  p.rep = clamp(p.rep + d * 0.62 - fade, 1, 100);
}

/* ---------- Legado y retirada ---------- */
function computeLegacy(G) {
  const p = G.player, c = p.career;
  let L = 0;
  L += c.apps * 0.28;
  L += c.goals * 1.5 + c.assists * 1.0;
  L += (c.cs || 0) * 1.1 + (c.saves || 0) * 0.05;
  L += c.ntApps * 1.4 + c.ntGoals * 2.4;
  p.trophies.forEach((t) => { L += titlePoints(t.name, '') * 2.6; });
  p.awards.forEach((a) => { L += a.pts * 3.4; });
  L += Math.max(0, p.peakOvr - 70) * 9;
  L += c.motm * 1.2;
  return Math.round(L);
}
function legacyRank(L) {
  if (L >= 3400) return { t: 'INMORTAL', d: 'Tu nombre está en la conversación del mejor de la historia.', icon: '👑', color: 'gold' };
  if (L >= 2400) return { t: 'LEYENDA MUNDIAL', d: 'Generaciones enteras crecerán viendo tus vídeos.', icon: '🏆', color: 'gold' };
  if (L >= 1600) return { t: 'ICONO', d: 'Un grande de tu época. Tu camiseta se sigue vendiendo.', icon: '⭐', color: 'purple' };
  if (L >= 1000) return { t: 'LEYENDA DE CLUB', d: 'En tu casa tienen tu nombre en una grada.', icon: '💚', color: 'acc' };
  if (L >= 600) return { t: 'PROFESIONAL DE ÉLITE', d: 'Una carrera larga y respetada en la primera línea.', icon: '🎽', color: 'blue' };
  if (L >= 300) return { t: 'HONRADO PROFESIONAL', d: 'Viviste del fútbol. No todo el mundo puede decirlo.', icon: '⚽', color: '' };
  return { t: 'UNO MÁS', d: 'El fútbol es cruel. Lo intentaste.', icon: '🌧️', color: 'dim' };
}

/* ---------- Aplicar efectos ---------- */
function applyEffects(G, raw) {
  const p = G.player;
  let e = typeof raw === 'function' ? raw(G) : raw;
  if (!e) return '';
  const add = (k, v) => { p[k] = clamp((p[k] || 0) + v, 0, 100); };
  if (e.morale) add('morale', e.morale);
  if (e.trust) add('trust', e.trust);
  if (e.fanLove) add('fanLove', e.fanLove);
  if (e.fitness) add('fitness', e.fitness);
  if (e.rep) p.rep = clamp(p.rep + e.rep, 1, 100);
  if (e.form) p.form = clamp(p.form + e.form, -60, 60);
  if (e.sp) p.sp += e.sp;
  if (e.money) p.money = Math.max(-5, (p.money || 0) + e.money);
  if (e.wageCut) p.wage *= e.wageCut;
  if (e.legacyBonus) p.legacyExtra = (p.legacyExtra || 0) + e.legacyBonus;
  if (e.attr) for (const k in e.attr) if (p.attrs[k] != null) p.attrs[k] = clamp(p.attrs[k] + e.attr[k], 20, 99);
  if (e.trait && !p.traits.includes(e.trait)) p.traits.push(e.trait);
  if (e.lose) p.traits = p.traits.filter((t) => t !== e.lose);
  if (e.flag) p.flags[e.flag] = 1;
  const m = G.mods;
  ['goals', 'assists', 'mins', 'growth', 'injuryRisk'].forEach((k) => { if (e[k]) m[k] = (m[k] || 1) * e[k]; });
  if (e.rating) m.rating = (m.rating || 0) + e.rating;
  if (e.extraGoals) m.extraGoals = (m.extraGoals || 0) + e.extraGoals;
  p.ovr = computeOvr(p);
  p.value = playerValue(p);
  return e.note || '';
}

function freshMods() {
  return { goals: 1, assists: 1, mins: 1, growth: 1, injuryRisk: 1, rating: 0, extraGoals: 0 };
}

/* ---------- Guardado ---------- */
const SAVE_KEY = 'elcamino.save.v1';
const META_KEY = 'elcamino.meta.v1';

function saveGame(G) {
  try {
    const data = {
      v: 1, seasonStart: G.seasonStart, player: G.player, clubId: G.club ? G.club.id : null,
      clubAcademy: G.club && G.club.academy ? G.club.parent : null,
      world: G.world, euro: G.euro, euroPool: G.euroPool, mods: G.mods,
      objectives: G.objectives, step: G.step, queue: serializeQueue(G.queue),
      seasonFeed: G.seasonFeed, history: G.player.history,
      squad: G.squad, squadClubId: G.squadClubId,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch (err) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const G = {
      seasonStart: d.seasonStart, player: d.player,
      club: d.clubAcademy ? academyOf(getClub(d.clubAcademy)) : getClub(d.clubId),
      world: d.world || {}, euro: d.euro || {}, euroPool: d.euroPool || {},
      mods: d.mods || freshMods(), objectives: d.objectives || [],
      step: d.step || 'season', queue: deserializeQueue(d.queue || []),
      seasonFeed: d.seasonFeed || [],
      squad: d.squad || null, squadClubId: d.squadClubId || null,
    };
    // sanear
    if (!G.club) return null;
    G.player.arcs = G.player.arcs || {};
    G.player.flags = G.player.flags || {};
    return G;
  } catch (e) { return null; }
}
function serializeQueue(q) { return (q || []).map((b) => ({ t: b.t, id: b.id || null, arcId: b.arcId || null })); }
function deserializeQueue(q) {
  return q.map((b) => {
    if (b.t === 'event') return { t: 'event', id: b.id, ev: EVENTS.find((e) => e.id === b.id) };
    if (b.t === 'moment') return { t: 'moment', id: b.id, m: MOMENTS.find((e) => e.id === b.id) };
    if (b.t === 'story') return { t: 'story', arcId: b.arcId };
    return b;
  }).filter((b) => b.t === 'preseason' || b.ev || b.m || b.arcId);
}
