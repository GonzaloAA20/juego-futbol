};

/* ---------- Mundo dinamico (ascensos y descensos) ---------- */
function leagueOfClub(G, club) { return (G.world && G.world[club.id]) || club.league; }
function leagueMembers(G, lk) { return CLUBS.filter((c) => leagueOfClub(G, c) === lk); }

/* ---------- Clasificacion simulada de una liga ---------- */
function simulateTable(G, lk, playerBoost) {
  const members = leagueMembers(G, lk);
  if (!members.length) return [];
  const avg = members.reduce((s, c) => s + c.str, 0) / members.length;
  const games = (members.length - 1) * 2;
  const rows = members.map((c) => {
    let pts = games * 1.38 + (c.str - avg) * (games / 17) + gauss(0, games * 0.19, -games, games);
    if (playerBoost && c.id === playerBoost.clubId) pts += playerBoost.pts;
    pts = clamp(Math.round(pts), 8, games * 2.6);
    return { club: c, pts };
  });
  rows.sort((a, b) => b.pts - a.pts || b.club.str - a.club.str);
  rows.forEach((r, i) => { r.pos = i + 1; });
  return rows;
}

/* ---------- Contribucion del jugador a su equipo ---------- */
function playerImpactPoints(p, club, stats) {
  const gap = p.ovr - club.str;
  const base = clamp(gap * 0.32, -3, 5);
  const prod = ((stats.goals || 0) + (stats.assists || 0) * 0.7) * 0.16;
  return clamp(base + prod * (stats.mins > 900 ? 1 : 0.4), -4, 9);
}

/* ---------- Partidos disponibles ---------- */
function seasonFixtures(G, club, euroTier) {
  const lk = leagueOfClub(G, club);
  const lg = LEAGUES[lk];
  const members = leagueMembers(G, lk).length || 18;
  const league = (members - 1) * 2;
  const cupRun = 1 + poisson(1.4 + club.prestige / 55);
  const cup = clamp(cupRun, 1, 7);
  let cont = 0;
  if (euroTier === 'ucl') cont = 8 + poisson(2.4);
  else if (euroTier === 'uel') cont = 8 + poisson(1.8);
  else if (euroTier === 'uecl') cont = 6 + poisson(1.6);
  else if (euroTier === 'cont') cont = 6 + poisson(2.2);
  return { league, cup, cont: Math.min(cont, 17), total: league + cup + Math.min(cont, 17), lg, lk };
}

/* ---------- Lesiones ---------- */
const INJURIES = [
  { n: 'Sobrecarga muscular', w: [1, 2], sev: 1 },
  { n: 'Esguince de tobillo', w: [2, 5], sev: 1 },
  { n: 'Rotura de fibras', w: [3, 7], sev: 2 },
  { n: 'Lesión en el isquiotibial', w: [3, 8], sev: 2 },
  { n: 'Fractura del quinto metatarsiano', w: [8, 14], sev: 3 },
  { n: 'Lesión de menisco', w: [8, 16], sev: 3 },
  { n: 'Pubalgia crónica', w: [6, 12], sev: 3 },
  { n: 'Rotura del ligamento cruzado', w: [26, 40], sev: 4 },
  { n: 'Rotura del tendón de Aquiles', w: [24, 38], sev: 4 },
];
function rollInjuries(p, mods) {
  const out = [];
  let risk = 0.30 * p.proneness * (mods.injuryRisk || 1);
  if (p.traits.includes('ironman')) risk *= 0.5;
  if (p.traits.includes('glass')) risk *= 1.75;
  if (p.age >= 31) risk *= 1 + (p.age - 30) * 0.12;
  if (p.age <= 18) risk *= 0.85;
  risk *= 1 + (70 - clamp(p.fitness, 20, 100)) / 130;
  let tries = 3;
  while (tries-- > 0 && chance(risk)) {
    const sevRoll = rnd();
    const pool = sevRoll < 0.55 ? INJURIES.slice(0, 2)
      : sevRoll < 0.85 ? INJURIES.slice(2, 4)
      : sevRoll < 0.975 ? INJURIES.slice(4, 7) : INJURIES.slice(7);
    const inj = pick(pool);
    out.push({ name: inj.n, weeks: ri(inj.w[0], inj.w[1]), sev: inj.sev });
    risk *= 0.45;
  }
  return out;
}

/* ---------- Una etapa de la temporada en un club concreto ----------
   Se separa del resto para poder partir el año en dos cuando hay fichaje de
   invierno: media temporada en cada equipo, con sus minutos y sus números. */
function playSpell(G, club, fx, availFrac, share, portion) {
  const p = G.player;
  const mods = G.mods;
  const lg = LEAGUES[leagueOfClub(G, club)];
  const availableMatches = Math.round(fx.total * availFrac * portion);
  let apps = Math.round(availableMatches * clamp(share * 1.04, 0, 0.98));
  apps = clamp(apps, 0, availableMatches);
  const minsPerApp = clamp(28 + share * 60 + rf(-4, 4), 15, 90);
  const mins = Math.round(apps * minsPerApp);
  const nineties = mins / 90;

  const posDef = POS_BY_KEY[p.pos];
  const ovrScale = Math.pow(clamp(p.ovr, 40, 99) / 75, 2.6);
  const teamAtk = Math.pow(clamp(club.str, 40, 95) / 72, 1.15);
  const leagueAdj = Math.pow(78 / clamp(lg ? lg.rep : 70, 45, 100), 0.34);
  let gMul = 1, aMul = 1;
  if (p.traits.includes('freekick')) gMul *= 1.15;
  if (p.traits.includes('poacher')) { gMul *= 1.18; aMul *= 0.9; }
  if (p.traits.includes('wizard')) aMul *= 1.2;
  gMul *= (mods.goals || 1); aMul *= (mods.assists || 1);

  const st = { apps, mins, goals: 0, assists: 0, motm: 0, yellow: 0, red: 0, cs: 0, saves: 0, conceded: 0, rating: 0 };

  if (p.pos === 'GK') {
    const defQ = Math.pow(clamp(club.str, 40, 95) / 72, 1.5) * Math.pow(p.ovr / 75, 0.55);
    let concPer90 = clamp(1.42 / defQ * leagueAdj, 0.28, 3.2);
    if (p.traits.includes('wall')) concPer90 *= 0.9;
    st.conceded = poisson(concPer90 * nineties);
    st.saves = poisson(clamp(2.4 + (1.6 - concPer90) * -1.1 + rf(-.3, .5), 1.2, 5.4) * nineties);
    const csP = Math.exp(-concPer90 * (minsPerApp / 90));
    for (let i = 0; i < apps; i++) if (chance(csP)) st.cs++;
    st.assists = poisson(0.02 * nineties * (p.traits.includes('sweeper') ? 3 : 1));
    st.goals = chance(0.012 * nineties) ? 1 : 0;
  } else {
    st.goals = poisson(posDef.g * ovrScale * teamAtk * leagueAdj * gMul * nineties) + Math.round((mods.extraGoals || 0) * portion);
    st.assists = poisson(posDef.a * ovrScale * Math.pow(teamAtk, 0.7) * leagueAdj * aMul * nineties);
  }
  st.goals = Math.max(0, st.goals);
  const cardBase = (p.pos === 'CB' || p.pos === 'DM' ? 0.22 : p.pos === 'GK' ? 0.04 : 0.13);
  st.yellow = poisson(cardBase * nineties * (p.traits.includes('hothead') ? 1.9 : 1));
  st.red = chance(clamp(nineties * 0.006 * (p.traits.includes('hothead') ? 3 : 1), 0, 0.5)) ? 1 : 0;

  let rating = 6.35 + (p.ovr - club.str) * 0.028 + (mods.rating || 0);
  if (p.pos === 'GK') rating += (st.cs / Math.max(1, apps)) * 1.5 - (st.conceded / Math.max(1, nineties)) * 0.28;
  else rating += ((st.goals + st.assists * 0.75) / Math.max(1, nineties)) * 1.15;
  rating += gauss(0, 0.16, -0.5, 0.5) + p.form / 400;
  st.rating = clamp(rating, 5.1, 9.4);
  st.motm = poisson(clamp(st.rating - 6.5, 0, 3) * apps * 0.075);
  return st;
}

function mergeSpells(a, b) {
  if (!b) return a;
  const out = {};
  ['apps', 'mins', 'goals', 'assists', 'motm', 'yellow', 'red', 'cs', 'saves', 'conceded']
    .forEach((k) => { out[k] = (a[k] || 0) + (b[k] || 0); });
  const wa = Math.max(1, a.apps), wb = Math.max(1, b.apps);
  out.rating = Math.round(((a.rating * wa + b.rating * wb) / (wa + wb)) * 100) / 100;
  return out;
}

/* ---------- Nucleo: simular la temporada del jugador ---------- */
function simulateSeason(G) {
  const p = G.player;
  const club = G.club;
  const mods = G.mods;
  const lk = leagueOfClub(G, club);
  const lg = LEAGUES[lk];
  const rep = { feed: [], titles: [], stats: null };

  /* --- lesiones --- */
  const injuries = rollInjuries(p, mods);
  const weeksOut = injuries.reduce((s, i) => s + i.weeks, 0);
  G.lastInjurySev = injuries.reduce((m, i) => Math.max(m, i.sev), 0);
  p.career.injuries += injuries.length;
  const seasonWeeks = 40;
  const availFrac = clamp(1 - weeksOut / seasonWeeks, 0.03, 1);

  /* --- partidos --- */
  const euroKey = club.academy ? club.parent : club.id;
  const euroTier = G.euro && G.euro[euroKey] ? G.euro[euroKey] : null;
  const fx = seasonFixtures(G, club, euroTier);

  /* --- minutos --- */
  const role = squadRole(p, club, competitorGap(G));
  const shareOf = (cl, gap) => {
    let sh = squadRole(p, cl, gap).min;
    sh *= 1 + (p.form / 260) + ((p.morale - 60) / 500) + ((p.trust - 55) / 320);
    sh *= (mods.mins || 1);
    if (p.traits.includes('engine')) sh *= 1.06;
    if (p.age >= 34) sh *= 1 - (p.age - 33) * 0.06;
    if (cl.academy) sh = clamp(sh + 0.25, 0, 0.95);
    return clamp(sh, 0.02, 0.97);
  };

  /* --- ¿hubo fichaje en enero? --- */
  const winter = G.winterMove ? getClub(G.winterMove.clubId) : null;
  let stats, spellA, spellB;
  if (winter) {
    // Media temporada en cada club. El equipo nuevo te conoce menos: arrancas
    // con menos crédito, pero si eres mejor que ellos, juegas.
    spellA = playSpell(G, club, fx, availFrac, shareOf(club, competitorGap(G)), 0.45);
    const fxB = seasonFixtures(G, winter, (G.euro || {})[winter.id] || null);
    spellB = playSpell(G, winter, fxB, availFrac, shareOf(winter, null) * 0.92, 0.55);
    stats = mergeSpells(spellA, spellB);
    rep.winter = { from: club, to: winter, a: spellA, b: spellB };
  } else {
    stats = playSpell(G, club, fx, availFrac, shareOf(club, competitorGap(G)), 1);
  }
  const mins = stats.mins;
  const apps = stats.apps;

  /* --- clasificacion y titulos ---
     Si te fuiste en enero, lo que cuenta es el equipo donde acabas la temporada:
     los títulos se levantan con la camiseta que llevas en mayo. */
  const endClub = winter || club;
  const endLk = leagueOfClub(G, endClub);
  const endLg = LEAGUES[endLk];
  const boost = { clubId: endClub.academy ? endClub.parent : endClub.id, pts: playerImpactPoints(p, endClub, winter ? spellB : stats) };
  const table = simulateTable(G, endLk, endClub.academy ? null : boost);
  const myRow = table.find((r) => r.club.id === (endClub.academy ? endClub.parent : endClub.id));
  const pos = myRow ? myRow.pos : Math.ceil(table.length / 2);
  rep.table = table; rep.leaguePos = pos;

  const played = mins > 400; // hay que haber jugado para "ganar" un titulo de verdad
  const titles = [];
  if (endLg) {
    if (pos === 1) titles.push({ name: endLg.tier === 1 ? endLg.name : endLg.name + ' (ascenso)', icon: '🏆', tier: endLg.tier === 1 ? 3 : 2 });
    else if (endLg.tier === 2 && pos === 2) titles.push({ name: 'Ascenso directo a ' + (LEAGUES[endLg.up] ? LEAGUES[endLg.up].name : 'Primera'), icon: '⬆️', tier: 2 });
    else if (endLg.tier === 2 && pos >= 3 && pos <= 6 && chance(0.28)) titles.push({ name: 'Ascenso por playoff', icon: '⬆️', tier: 2 });
  }
  // Copa nacional (el filial no la juega)
  if (endLg && endLg.cup && !endClub.academy) {
    const pool = CLUBS.filter((c) => c.country === endLg.country && LEAGUES[leagueOfClub(G, c)]);
    const cupWinner = pickW(pool, (c) => Math.pow(Math.max(1, c.str - 42), 3.1) * (1 + c.prestige / 160));
    const me = endClub.academy ? getClub(endClub.parent) : endClub;
    if (cupWinner && cupWinner.id === me.id) titles.push({ name: endLg.cup, icon: '🥇', tier: 2 });
    else rep.cupRound = roundPhrase(rnd() * (1.05 - clamp(me.str - 55, 0, 35) / 55), false);
  }
  // Supercopa
  if (endLg && endLg.supercup && chance(0.16 + clamp((endClub.prestige - 70) / 130, 0, 0.3))) {
    if (endClub.prestige > 70 && chance(0.5)) titles.push({ name: endLg.supercup, icon: '🛡️', tier: 1 });
  }
  // Continental (el filial no la juega)
  if (euroTier && !club.academy) {
    const contName = contCompName(endClub.confed, euroTier);
    const poolIds = (G.euroPool && G.euroPool[euroTier]) || [];
    const pool = poolIds.map(getClub).filter(Boolean);
    const me = endClub.academy ? getClub(endClub.parent) : endClub;
    if (pool.length) {
      const winner = pickW(pool, (c) => Math.pow(Math.max(1, c.str - 55), 3.4) * (1 + c.prestige / 130));
      if (winner && winner.id === me.id) titles.push({ name: contName, icon: euroTier === 'ucl' ? '🏆' : '🏅', tier: euroTier === 'ucl' ? 4 : 2 });
      else {
        const rank = pool.filter((c) => c.str > me.str).length / Math.max(1, pool.length);
        rep.contRound = roundPhrase(clamp(rank + rf(-0.18, 0.3), 0.03, 1), true);
        rep.contName = contName;
      }
    }
  }
  // en la cantera no ganas los titulos del primer equipo
  if (!played || endClub.academy) titles.length = 0;
  if (endClub.academy) {
    rep.youthNote = pos <= 3
      ? `El primer equipo del ${getClub(endClub.parent).name} pelea arriba, pero tú todavía lo ves desde el filial.`
      : `Otro año de formación en la cantera del ${getClub(endClub.parent).name}.`;
  }
  rep.titles = titles;

  /* --- desarrollo --- */
  const dev = developPlayer(G, stats, { pos, titles, mins, apps });
  rep.dev = dev;

  /* --- descenso / ascenso del club --- */
  rep.relegated = false; rep.promoted = false;
  if (endLg && endLg.tier === 1 && endLg.down) {
    const nRel = RELEGATION[endLk] != null ? RELEGATION[endLk] : 3;
    if (nRel > 0 && pos > table.length - nRel) rep.relegated = true;
  }
  if (endLg && endLg.tier === 2 && titles.some((t) => /[Aa]scenso/.test(t.name) || t.name === endLg.name)) rep.promoted = true;

  /* El traspaso de enero se hace efectivo: a partir de ahora este es tu club */
  if (winter) {
    G.club = winter;
    p.contract = G.winterMove.years || ri(3, 4);
    p.wage = G.winterMove.wage || p.wage;
    p.seasonsAtClub = 0;
    p.loanFrom = null; p.loanYears = 0;
    p.trust = clamp(50 + rf(-5, 8), 30, 75);
    p.fanLove = clamp(48 + rf(-6, 10), 25, 70);
    G.winterMove = null;
    G.squad = null; G.squadClubId = null;   // vestuario nuevo
  }

  rep.stats = stats;
  rep.injuries = injuries;
  rep.club = endClub; rep.league = endLg; rep.euroTier = euroTier;
  rep.fixtures = fx;
  rep.role = role;
  return rep;
}

function contCompName(confed, tier) {
  const c = CONTINENTAL[confed] || CONTINENTAL.UEFA;
  if (tier === 'ucl' || tier === 'cont') return c.elite;
  if (tier === 'uel') return c.second || c.elite;
  return c.third || c.second || c.elite;
}

/* ---------- Evolucion del jugador ---------- */
const AGE_GROWTH = { 16: 1.00, 17: 1.00, 18: 0.96, 19: 0.90, 20: 0.84, 21: 0.78, 22: 0.70, 23: 0.61, 24: 0.52, 25: 0.43, 26: 0.34, 27: 0.25, 28: 0.17, 29: 0.11, 30: 0.06 };

function developPlayer(G, stats, ctx) {
  const p = G.player;
  const mods = G.mods;
  const before = p.ovr;

  const minutesF = clamp(0.28 + (stats.mins / 2100) * 0.9, 0.28, 1.28);
  let ageF = AGE_GROWTH[p.age] != null ? AGE_GROWTH[p.age] : 0;
  if (p.traits.includes('wonderkid') && p.age <= 22) ageF *= 1.25;
  if (p.traits.includes('latebloomer') && p.age >= 25) ageF = Math.max(ageF, 0.36 - (p.age - 25) * 0.04);

  const gap = Math.max(0, p.pot - p.ovr);
  let growth = ageF * gap * 0.225 * minutesF * (mods.growth || 1) * rf(0.72, 1.3);

  // rendimiento por encima de lo esperado acelera; jugar mal frena
  const perf = (stats.rating - 6.6) * 1.3;
  growth += clamp(perf, -1.2, 1.6) * (p.age <= 26 ? 0.55 : 0.3);
  // entrenar en un club grande ayuda
  growth *= 0.9 + clamp((G.club.str - 60) / 130, -0.1, 0.32);

  // declive
  let decline = 0;
  const declineAge = 29 + (p.pos === 'GK' ? 4 : p.pos === 'CB' || p.pos === 'DM' ? 2 : 0) + (p.traits.includes('professor') ? 2 : 0);
  if (p.age > declineAge) {
    decline = (p.age - declineAge) * 0.92 + rf(0, 1.2);
    if (stats.mins > 1800) decline *= 0.8;
    if (p.attrs.phy != null) decline *= 1 + (60 - clamp(p.attrs.phy, 30, 99)) / 200;
  }
  // lesiones graves pasan factura
  const badInj = (G.lastInjurySev || 0);
  if (badInj >= 3) decline += badInj === 4 ? rf(1.2, 3.4) : rf(0.4, 1.4);

  let delta = clamp(growth - decline, -7, 7.5);
  if (p.age <= 20) delta = Math.max(delta, -1.5);

  // repartir en atributos
  const list = attrsFor(p.pos);
  const w = WEIGHTS[p.pos];
  const totalPts = delta * 6.2;
  let assigned = 0;
  const order = shuffle(list.slice());
  order.forEach((a) => {
    const share = (w[a.key] || 0.05) + rf(-0.03, 0.05);
    let v = totalPts * share;
    assigned += v;
    p.attrs[a.key] = clamp(Math.round((p.attrs[a.key] + v) * 10) / 10, 22, 99);
  });
  p.ovr = computeOvr(p);
  // asegurar coherencia con el delta calculado
  const drift = (before + delta) - p.ovr;
  if (Math.abs(drift) >= 1) {
    const k = pickW(list, (a) => (w[a.key] || 0.05));
    p.attrs[k.key] = clamp(p.attrs[k.key] + drift, 22, 99);
    p.ovr = computeOvr(p);
  }

  // puntos de entrenamiento para gastar a mano
  let sp = 2;
  if (p.age <= 21) sp += 2;
  else if (p.age <= 26) sp += 1;
  if (stats.mins > 2300) sp += 1;
  if (stats.rating >= 7.3) sp += 1;
  if (ctx.titles.length) sp += 1;
  if (p.age >= 31) sp = Math.max(1, sp - 2);   // a partir de cierta edad ya no se aprende igual
  p.sp += sp;

  return { before, after: p.ovr, delta: p.ovr - before, sp, growthRaw: growth, decline };
}

/* ---------- Actualizar el mundo tras la temporada ----------
   `cache` permite reutilizar la clasificacion que ya ha visto el jugador,
   para que lo que pasa en su liga sea coherente con su resumen de temporada. */
function advanceWorld(G, cache) {
  cache = cache || {};
  const tableFor = (lk) => (cache[lk] && cache[lk].length ? cache[lk] : simulateTable(G, lk));
  const done = {};
  for (const lk in LEAGUES) {
    const lg = LEAGUES[lk];
    if (lg.tier !== 1 || !lg.down || done[lk]) continue;
    const nRel = RELEGATION[lk] != null ? RELEGATION[lk] : 3;
    if (!nRel) continue;
    const t1 = tableFor(lk), t2 = tableFor(lg.down);
    if (!t1.length || !t2.length) continue;
    const down = t1.slice(-nRel).map((r) => r.club);
    const up = t2.slice(0, nRel).map((r) => r.club);
    down.forEach((c) => { G.world[c.id] = lg.down; });
    up.forEach((c) => { G.world[c.id] = lk; });
    done[lk] = done[lg.down] = true;
  }
  computeEuroSpots(G, cache);
}

/* ---------- Plazas continentales ---------- */
function computeEuroSpots(G, cache) {
  cache = cache || {};
  G.euro = {}; G.euroPool = { ucl: [], uel: [], uecl: [], cont: [] };
  for (const lk in LEAGUES) {
    const lg = LEAGUES[lk];
    if (lg.tier !== 1) continue;
    const country = COUNTRY_BY_CODE[lg.country];
    const confed = country ? country.confed : 'UEFA';
    const table = (cache[lk] && cache[lk].length) ? cache[lk] : simulateTable(G, lk);
    if (!table.length) continue;
    if (confed === 'UEFA') {
      let i = 0;
      for (let n = 0; n < lg.ucl && i < table.length; n++, i++) { G.euro[table[i].club.id] = 'ucl'; G.euroPool.ucl.push(table[i].club.id); }
      for (let n = 0; n < lg.uel && i < table.length; n++, i++) { G.euro[table[i].club.id] = 'uel'; G.euroPool.uel.push(table[i].club.id); }
      for (let n = 0; n < lg.uecl && i < table.length; n++, i++) { G.euro[table[i].club.id] = 'uecl'; G.euroPool.uecl.push(table[i].club.id); }
    } else {
      const slots = CONT_SLOTS[lk] || 0;
      for (let i = 0; i < slots && i < table.length; i++) { G.euro[table[i].club.id] = 'cont'; G.euroPool.cont.push(table[i].club.id); }
    }
  }
}

/* ---------- Objetivos de temporada ---------- */
function makeObjectives(G) {
  const p = G.player, club = G.club, lg = LEAGUES[leagueOfClub(G, club)];
  const role = squadRole(p, club, competitorGap(G));
  const objs = [];
  const expMins = Math.round(role.min * 34 * 78);
  objs.push({ id: 'mins', text: `Jugar más de ${Math.round(expMins / 90)} partidos completos`, target: expMins, kind: 'mins', reward: 1 });
  if (p.pos === 'GK') {
    objs.push({ id: 'cs', text: `Dejar la portería a cero ${Math.max(4, Math.round(role.min * 12))} veces`, target: Math.max(4, Math.round(role.min * 12)), kind: 'cs', reward: 2 });
  } else if (['ST', 'LW', 'RW', 'AM'].includes(p.pos)) {
    const t = Math.max(3, Math.round(POS_BY_KEY[p.pos].g * (expMins / 90) * Math.pow(p.ovr / 75, 2.2)));
    objs.push({ id: 'goals', text: `Marcar ${t} goles`, target: t, kind: 'goals', reward: 2 });
  } else {
    const t = Math.max(2, Math.round(POS_BY_KEY[p.pos].a * (expMins / 90) * Math.pow(p.ovr / 75, 2)) + 1);
    objs.push({ id: 'assists', text: `Repartir ${t} asistencias`, target: t, kind: 'assists', reward: 2 });
  }
  if (lg && lg.tier === 1 && club.str > 76) objs.push({ id: 'pos', text: 'Clasificar al equipo para Europa', target: 6, kind: 'pos', reward: 2 });
  else if (lg && lg.tier === 2) objs.push({ id: 'pos', text: 'Pelear el ascenso (top 6)', target: 6, kind: 'pos', reward: 2 });
  else objs.push({ id: 'rating', text: 'Terminar con una nota media de 7.0', target: 7.0, kind: 'rating', reward: 2 });
  return objs;
}
function checkObjectives(G, rep) {
  const s = rep.stats;
  return (G.objectives || []).map((o) => {
    let val;
    if (o.kind === 'mins') val = s.mins;
    else if (o.kind === 'pos') val = rep.leaguePos;
    else if (o.kind === 'rating') val = s.rating;
    else val = s[o.kind] || 0;
    const ok = o.kind === 'pos' ? val <= o.target : val >= o.target;
    return { ...o, val, ok };
  });
}


/* ===== engine.market.js ===== */
/* ============================================================
   MERCADO: arranque a los 16, ofertas, contratos, cesiones
   ============================================================ */

/* ---------- Sueldos ---------- */
function wageFor(club, p, roleKey) {
  const roleMul = { star: 1.45, key: 1.15, starter: 1.0, rot: 0.75, sub: 0.55, fringe: 0.4 }[roleKey] || 1;
  const base = Math.pow(clamp(club.str, 35, 95) / 60, 3.4) * Math.pow(clamp(p.ovr, 40, 99) / 70, 4) * 0.6;
  const ageMul = p.age <= 19 ? 0.35 : p.age <= 22 ? 0.65 : p.age >= 34 ? 0.8 : 1;
  const repMul = 1 + p.rep / 300 + (p.traits.includes('mediastar') ? 0.18 : 0);
  return Math.max(0.02, base * roleMul * ageMul * repMul * rf(0.9, 1.12));
}

/* ---------- Afinidad de un pais con una liga ---------- */
function countryAffinity(country, clubCountry) {
  if (country.code === clubCountry) return 100;
  if (country.links.includes(clubCountry)) return 14;
  const cc = COUNTRY_BY_CODE[clubCountry];
  if (cc && cc.confed === country.confed) return 5;
  return 1.1;
}

/* ---------- Opciones al empezar (16 anios) ---------- */
function startingOptions(G) {
  const p = G.player;
  const country = COUNTRY_BY_CODE[p.country];
  const homeLeagues = Object.values(LEAGUES).filter((l) => l.country === country.code);
  const hasHome = homeLeagues.length > 0;

  // Cuanto se te ve el talento con 16: no es tu potencial real, es lo que aparenta
  const visible = p.ovr + (p.pot - p.ovr) * rf(0.15, 0.45) + rf(-3, 4);
  const options = [];

  // -- Opcion 1: cantera de un club grande --
  const bigPool = CLUBS.filter((c) => {
    const lg = LEAGUES[c.league];
    if (!lg || lg.tier !== 1) return false;
    if (c.prestige < 62) return false;
    return countryAffinity(country, c.country) >= (hasHome ? 100 : 5);
  });
  // salir de un pais sin liga profesional modelada cuesta mas: menos ojeadores, menos contactos
  const exile = hasHome ? 0 : (country.tier - 2) * 3.5;
  const big = bigPool.length ? pickW(bigPool, (c) => {
    const aff = countryAffinity(country, c.country);
    // cuanto mas grande el club, mas dificil entrar; el talento visible abre puertas
    const reach = Math.exp(-(c.prestige - 58 + exile - (visible - 52) * 1.5) / 13);
    return aff * clamp(reach, 0.01, 8);
  }) : null;
  if (big) {
    options.push({
      kind: 'academy', club: academyOf(big), parent: big,
      title: 'Cantera del ' + big.name,
      desc: big.prestige >= 84
        ? 'Te ficha uno de los grandes de Europa. Formación de élite, pero hay cuarenta chavales más peleando por tu puesto.'
        : big.prestige >= 70
          ? 'Un club de Primera con una cantera seria. Se sale de aquí, pero hay que ganárselo.'
          : 'Un club de Primera modesto te mete en su cantera. No es el Madrid, pero es Primera.',
      pros: ['Mejor formación', 'Escaparate mundial'], cons: ['Muchísima competencia', 'Pocos minutos al principio'],
      dev: 1.18, minsMod: 0.72,
    });
  }

  // -- Opcion 2: primer equipo de un club modesto (mas minutos) --
  const modestPool = CLUBS.filter((c) => {
    const lg = LEAGUES[c.league];
    if (!lg) return false;
    if (c.str > clamp(visible + 16, 52, 70)) return false;
    return countryAffinity(country, c.country) >= (hasHome ? 100 : 5);
  });
  const modest = modestPool.length ? pickW(modestPool, (c) => {
    const lg = LEAGUES[c.league];
    return countryAffinity(country, c.country) * (lg.tier === 2 ? 3 : 1) * (1 / (1 + Math.abs(c.str - visible - 8) / 6));
  }) : null;
  if (modest) {
    options.push({
      kind: 'first', club: modest, parent: null,
      title: modest.name,
      desc: `Te suben al primer equipo. Nivel más bajo, pero vas a jugar de verdad desde el primer día.`,
      pros: ['Minutos garantizados', 'Debut temprano'], cons: ['Entorno menos exigente', 'Menos escaparate'],
      dev: 0.95, minsMod: 1.2,
    });
  }

  // -- Opcion 3: salir fuera --
  const abroadPool = CLUBS.filter((c) => {
    if (c.country === country.code) return false;
    const lg = LEAGUES[c.league];
    if (!lg) return false;
    const aff = countryAffinity(country, c.country);
    if (aff < 5) return false;
    return c.str <= clamp(visible + 26, 60, 88);
  });
  const abroad = abroadPool.length ? pickW(abroadPool, (c) => {
    const aff = countryAffinity(country, c.country);
    const lg = LEAGUES[c.league];
    const reach = Math.exp(-(c.prestige - 52 - (visible - 52) * 1.6) / 15);
    return aff * clamp(reach, 0.01, 6) * (lg.rep / 70);
  }) : null;
  if (abroad) {
    const useAcademy = abroad.prestige > 62 || chance(0.5);
    options.push({
      kind: useAcademy ? 'academy' : 'first',
      club: useAcademy ? academyOf(abroad) : abroad, parent: useAcademy ? abroad : null,
      title: (useAcademy ? 'Cantera del ' : '') + abroad.name,
      desc: `Hacer las maletas con 16 años. ${COUNTRY_BY_CODE[abroad.country].flag} ${COUNTRY_BY_CODE[abroad.country].name}, lejos de casa, todo por descubrir.`,
      pros: ['Liga más potente', 'Salto de nivel'], cons: ['Adaptación dura', 'Sin red de seguridad'],
      dev: 1.08, minsMod: 0.85, abroad: true,
    });
  }

  // Rellenar si falta alguna
  while (options.length < 3) {
    const c = pickW(CLUBS.filter((x) => LEAGUES[x.league] && x.str < visible + 18), (x) => countryAffinity(country, x.country));
    if (!c) break;
    if (options.some((o) => (o.parent || o.club).name === c.name)) continue;
    options.push({
      kind: 'first', club: c, parent: null, title: c.name,
      desc: 'Una oportunidad inesperada. Nadie apostaba por ti aquí.',
      pros: ['Sitio libre en la plantilla'], cons: ['Proyecto sin garantías'],
      dev: 1.0, minsMod: 1.05,
    });
  }
  return options.slice(0, 3);
}

/* ---------- Peso real del jugador en el mercado ----------
   La media no lo es todo. Un pichichi de la Premier campeón de Europa con su
   selección vale mucho más de lo que dice su media, y los clubes grandes lo saben.
   Esto convierte una gran temporada en puertas que antes estaban cerradas. */
function playerStature(G, ctx) {
  const p = G.player;
  let b = 0;
  b += clamp((p.rep - 40) * 0.12, -4, 8);                                    // fama acumulada
  b += clamp((ctx.rating - 6.8) * 5, -6, 6);                                 // cómo has jugado
  b += Math.min(6, ((ctx.goals || 0) + (ctx.assists || 0) * 0.7) * 0.18);    // números
  b += Math.min(7, (ctx.awardPts || 0) * 0.3);                               // premios individuales
  b += Math.min(6, (ctx.titlePts || 0) * 0.16);                              // títulos, club y selección
  if (ctx.ntElite) b += 2.5;
  if (p.age <= 22 && p.pot - p.ovr >= 8) b += 3;                             // proyección
  if ((ctx.mins || 0) < 900) b -= 8;
  if (p.age >= 32) b -= (p.age - 31) * 2.5;
  if (p.traits.includes('mediastar')) b += 1.5;
  return p.ovr + clamp(b, -12, 14);
}

/* ---------- ¿Puede este club venir a por ti? ----------
   Devuelve 0 si está fuera de tu alcance o si te queda pequeño, y si no, lo
   probable que es que se interesen. */
function clubFeasibility(G, club, ctx) {
  const p = G.player;
  const st = ctx.stature;
  const cur = G.club;
  if (cur && (club.id === cur.id || (cur.parent && club.id === cur.parent))) return 0;
  const lg = LEAGUES[leagueOfClub(G, club)];
  if (!lg) return 0;
  if (club.str > st + 3) return 0;          // por encima de tu talla
  if (club.str < st - 17) return 0;         // muy por debajo: ni ellos preguntan ni tú irías

  // Tu nivel real sigue contando: por muy buena que sea la temporada, un 82
  // no aterriza en una plantilla de 93 de un verano para otro.
  let f = Math.exp(-Math.max(0, club.str - p.ovr - 4) / 5);
  // Los clubes con más caché son selectivos con los que no tienen nombre todavía
  f *= Math.exp(-Math.max(0, club.prestige - 76 - (p.rep - 42) * 0.8) / 20);
  if (p.age >= 31) f *= Math.max(0.12, 1 - (p.age - 30) * 0.24);
  if (p.age <= 18) f *= 0.5;
  if ((ctx.mins || 0) < 700) f *= 0.35;
  if (p.injuryHistory >= 4) f *= 0.8;
  if (p.traits.includes('hothead')) f *= 0.88;
  if (p.flags && p.flags.superAgent) f *= 1.3;
  f *= Math.pow(countryAffinity(COUNTRY_BY_CODE[p.country], club.country), 0.18);
  f *= 0.75 + lg.rep / 190;
  return f;
}

/* ---------- Etapa de carrera: hace que la edad se note ---------- */
function careerStage(age) {
  if (age <= 18) return { key: 'promesa', name: 'Promesa', desc: 'Todo por demostrar.' };
  if (age <= 21) return { key: 'irrupcion', name: 'Irrupción', desc: 'El momento de dar el salto.' };
  if (age <= 25) return { key: 'consolidacion', name: 'Consolidación', desc: 'Toca confirmar lo que prometías.' };
  if (age <= 29) return { key: 'plenitud', name: 'Plenitud', desc: 'Tus mejores años. Ahora o nunca.' };
  if (age <= 33) return { key: 'veterania', name: 'Veteranía', desc: 'La experiencia empieza a pesar más que las piernas.' };
  return { key: 'ultimasbalas', name: 'Últimas balas', desc: 'Cada temporada puede ser la última.' };
}

/* ---------- Generar el mercado de verano ---------- */
function generateMarket(G, rep) {
  const p = G.player;
  const cur = G.club;
  const s = rep.stats;
  const lgName = rep.league ? rep.league.name : '';
  const ctx = {
    rating: s.rating, goals: s.goals, assists: s.assists, mins: s.mins,
    awardPts: (G.lastAwards || []).reduce((a, x) => a + x.pts, 0),
    titlePts: (rep.titles || []).concat(rep.ntTitles || [])
      .reduce((a, t) => a + titlePoints(t.name, lgName), 0),
    ntElite: p.nt.level === 'Absoluta' && (COUNTRY_BY_CODE[p.country] || {}).tier <= 2,
  };
  ctx.stature = playerStature(G, ctx);
  G.lastStature = Math.round(ctx.stature);
  const opts = [];

  /* --- 1. Palabra dada a mitad de temporada: aquí no se elige --- */
  if (G.committedTo) {
    const c = getClub(G.committedTo.clubId) || G.committedTo.club;
    if (c) {
      const nr = squadRole(p, c);
      opts.push({
        type: 'transfer', club: c, binding: true,
        title: 'Firmar por el ' + c.name,
        desc: G.committedTo.reason || 'Diste tu palabra en mitad de temporada. El acuerdo ya está cerrado y no hay marcha atrás.',
        wage: wageFor(c, p, nr.key), years: p.age >= 32 ? ri(1, 2) : ri(3, 5),
        tags: ['Acuerdo cerrado', nr.name],
      });
      G.committedTo = null;
      return { options: opts, clubWants: false, binding: true, stature: ctx.stature };
    }
    G.committedTo = null;
  }

  /* --- 2. Cesión en curso --- */
  if (p.loanFrom) {
    const parent = getClub(p.loanFrom);
    const boughtOut = ctx.stature >= cur.str + 2 && s.mins > 1500 && chance(0.55);
    if ((p.loanYears || 0) >= 1) {
      opts.push({
        type: 'stay', club: cur,
        title: 'Seguir cedido en el ' + cur.name,
        desc: 'A la cesión le queda otro año. Sigues creciendo lejos de casa.',
        wage: p.wage, years: 1, tags: ['Cesión en curso', squadRole(p, cur, competitorGap(G)).name],
      });
    }
    if (boughtOut) {
      const nr = squadRole(p, cur);
      opts.push({
        type: 'transfer', club: cur,
        title: 'El ' + cur.name + ' ejecuta la opción de compra',
        desc: 'Han visto suficiente. Te quieren en propiedad.',
        wage: wageFor(cur, p, nr.key), years: ri(3, 5), tags: ['Traspaso definitivo', nr.name],
      });
    }
    if (parent && (p.loanYears || 0) < 1) {
      const pr = squadRole(p, parent);
      opts.push({
        type: 'return', club: parent,
        title: 'Volver al ' + parent.name,
        desc: pr.min >= 0.6
          ? 'Se acabó la cesión y vuelves con otro cartel. Ahora sí cuentan contigo.'
          : 'Se acabó la cesión y toca volver, te guste o no. Ahí sigue la competencia que dejaste.',
        wage: wageFor(parent, p, pr.key), years: Math.max(1, p.contract), tags: ['Fin de cesión', pr.name],
      });
    }
  }

  /* --- 3. ¿Te quiere tu club? --- */
  const role = squadRole(p, cur, competitorGap(G));
  const parentClub = cur.academy ? getClub(cur.parent) : cur;
  let clubWants = true;
  if (!p.loanFrom) {
    if (cur.academy) {
      const readiness = p.ovr - parentClub.str;
      if (readiness >= -8 || (p.age >= 19 && readiness >= -13)) {
        const nr = squadRole(p, parentClub);
        opts.push({
          type: 'promote', club: parentClub,
          title: 'Subir al primer equipo del ' + parentClub.name,
          desc: 'El club te sube. Se acabó la cantera: ahora te mides con los mayores.',
          wage: wageFor(parentClub, p, nr.key), years: ri(3, 5),
          tags: ['Sueño cumplido', nr.name],
        });
      } else if (p.age >= 19) {
        clubWants = false;
      } else {
        opts.push({
          type: 'stay', club: cur, title: 'Seguir en la cantera del ' + parentClub.name,
          desc: 'Un año más de formación. Todavía no te ven listo.',
          wage: Math.max(0.03, wageFor(cur, p, role.key) * 0.5), years: 1, tags: ['Paciencia'],
        });
      }
    } else {
      const keep = (ctx.stature - cur.str) * 5 + (s.rating - 6.5) * 40
        + (p.age <= 26 ? 15 : p.age >= 34 ? -30 : 0) + (s.mins > 900 ? 12 : -14);
      clubWants = keep > -20 && !(p.flags && p.flags.wantOut);
      if (clubWants) {
        opts.push({
          type: 'stay', club: cur,
          title: 'Renovar con el ' + cur.name,
          desc: p.contract <= 1 ? 'El club te pone un contrato nuevo sobre la mesa.' : 'Sigues bajo contrato. Un año más en casa.',
          wage: wageFor(cur, p, role.key) * (p.traits.includes('loyal') ? 1.06 : 1),
          years: p.age >= 33 ? 1 : ri(2, 4), tags: [role.name, 'Continuidad'],
        });
      }
    }
  }

  /* --- 4. Ofertas de fuera, dentro de la banda que te corresponde --- */
  const pool = [];
  for (const c of CLUBS) {
    const f = clubFeasibility(G, c, ctx);
    if (f > 0.03) pool.push({ club: c, f: f * rf(0.55, 1.45) });
  }
  pool.sort((a, b) => b.f - a.f);
  // Como mucho dos clubes por liga: variedad sin que una sola liga cope el mercado
  const perLeague = {};
  const picks = [];
  for (const x of pool) {
    const lk = leagueOfClub(G, x.club);
    perLeague[lk] = (perLeague[lk] || 0) + 1;
    if (perLeague[lk] > 2) continue;
    picks.push(x);
    if (picks.length >= 12) break;
  }

  let nOffers = clamp(Math.round(gauss(2.2, 1, 0, 3)), 0, 3);
  if (p.flags && (p.flags.wantOut || p.flags.forceMove)) nOffers = Math.max(nOffers, 2);
  if (!picks.length) nOffers = 0;

  const chosen = shuffle(picks.slice(0, 8)).slice(0, nOffers);
  /* Si has hecho una temporada grande, al menos una oferta tiene que ser un paso
     adelante de verdad: es justo lo que fallaba antes. No siempre el mismo club,
     porque entonces todas las carreras acaban en el mismo sitio. */
  const bigSeason = ctx.stature >= cur.str + 4 && s.mins > 1200;
  if (bigSeason) {
    const ups = picks.filter((x) => x.club.str > cur.str + 1);
    if (ups.length) {
      const best = pickW(ups.slice(0, 6), (x) => x.f * (1 + x.club.prestige / 130));
      if (best && !chosen.some((x) => x.club.id === best.club.id)) {
        if (chosen.length >= 3) chosen[chosen.length - 1] = best; else chosen.push(best);
      }
    }
  }

  chosen.forEach((x) => {
    const c = x.club;
    const nr = squadRole(p, c);
    const lg = LEAGUES[leagueOfClub(G, c)];
    opts.push({
      type: 'transfer', club: c,
      title: 'Fichar por el ' + c.name,
      desc: offerFlavour(G, c, nr, cur),
      wage: wageFor(c, p, nr.key), years: p.age >= 32 ? ri(1, 2) : ri(3, 5),
      tags: [lg.name, nr.name, c.prestige > 80 ? 'Club histórico' : lg.tier === 2 ? 'Segunda división' : 'Primera división'],
      fee: playerValue(p) * rf(0.85, 1.6),
      stepUp: c.str - cur.str,
    });
  });

  /* --- 5. Cesiones: la vía normal de los jóvenes que no juegan --- */
  const askedLoan = !!(p.flags && p.flags.wantLoan);
  if (!p.loanFrom && !cur.academy && (p.age <= 23 || askedLoan) && p.age <= 25
      && (s.mins < 1200 || role.min < 0.5 || askedLoan)) {
    const loanPool = CLUBS.filter((c) => {
      const lg = LEAGUES[leagueOfClub(G, c)];
      return lg && c.id !== cur.id && c.str < p.ovr + 6 && c.str > p.ovr - 16;
    });
    if (loanPool.length) {
      const lc = pickW(loanPool, (c) => countryAffinity(COUNTRY_BY_CODE[p.country], c.country)
        * (1 / (1 + Math.abs(c.str - p.ovr + 4) / 5)));
      const yrs = chance(askedLoan ? 0.55 : 0.4) ? 2 : 1;
      if (p.flags) delete p.flags.wantLoan;
      opts.push({
        type: 'loan', club: lc, backTo: cur.id, loanYears: yrs,
        title: 'Cesión al ' + lc.name + (yrs === 2 ? ' (dos años)' : ''),
        desc: yrs === 2
          ? 'Dos temporadas fuera para hacerte jugador. Es mucho tiempo, pero vas a jugarlo todo.'
          : 'Un año fuera para jugar. Si respondes, vuelves con otro cartel.',
        wage: wageFor(lc, p, 'starter') * 0.7, years: yrs,
        tags: ['Cesión', yrs === 2 ? 'Dos años' : 'Un año', 'Minutos asegurados'],
      });
    }
  }

  /* --- 6. Si no queda nada --- */
  const realOptions = opts.filter((o) => o.type !== 'retire');
  const stillWorthIt = p.age <= 33 || p.ovr >= 66 || chance(clamp(0.75 - (p.age - 33) * 0.18, 0, 0.75));
  if (!realOptions.length && stillWorthIt) {
    const desperate = CLUBS.filter((c) => {
      const lg = LEAGUES[leagueOfClub(G, c)];
      return lg && c.str <= p.ovr + 2 && c.str >= p.ovr - 18;
    });
    if (desperate.length) {
      const c = pickW(desperate, (x) => countryAffinity(COUNTRY_BY_CODE[p.country], x.country) / (1 + Math.abs(x.str - p.ovr + 6)));
      opts.push({
        type: 'transfer', club: c, title: 'Firmar por el ' + c.name,
        desc: 'La única puerta que sigue abierta. Hay que seguir jugando.',
        wage: wageFor(c, p, 'starter') * 0.8, years: ri(1, 2),
        tags: [LEAGUES[leagueOfClub(G, c)].name, 'Última oportunidad'],
      });
    }
  }

  /* --- 7. Retirada --- */
  if (!opts.filter((o) => o.type !== 'retire').length) {
    opts.push({
      type: 'retire', club: null, forced: true,
      title: 'Colgar las botas',
      desc: 'No queda ni una oferta sobre la mesa. El teléfono lleva todo el verano sin sonar.',
      tags: ['Sin ofertas'],
    });
  } else if (p.age >= 32) {
    opts.push({
      type: 'retire', club: null,
      title: 'Colgar las botas',
      desc: p.age >= 37 ? 'Ha sido un viaje largo. Retirarte ahora, en tus términos.' : 'Dejarlo ya y empezar otra vida.',
      tags: ['Fin de carrera'],
    });
  }
  return { options: opts, clubWants, stature: ctx.stature };
}

function offerFlavour(G, club, role, cur) {
  const lg = LEAGUES[leagueOfClub(G, club)];
  const bits = [];
  const step = cur ? club.str - cur.str : 0;
  if (club.prestige >= 88) bits.push('Uno de los grandes de Europa llama a tu puerta.');
  else if (step >= 6) bits.push('Un salto de nivel claro respecto a donde estás.');
  else if (club.prestige >= 74) bits.push('Un club con historia que quiere volver a lo más alto.');
  else if (lg.tier === 2) bits.push('Proyecto de ascenso: quieren que seas el líder.');
  else if (step <= -5) bits.push('Bajarías de nivel, pero serías el amo del equipo.');
  else bits.push('Un club que te ha seguido toda la temporada.');
  if (role.key === 'star') bits.push('Te quieren como estandarte del equipo.');
  else if (role.key === 'key') bits.push('Titular desde el primer día.');
  else if (role.key === 'rot' || role.key === 'sub') bits.push('Tendrías que pelear un sitio.');
  const eu = G.euro && G.euro[club.id];
  if (eu) bits.push('Juegan ' + contCompName(club.confed, eu) + ' la temporada que viene.');
  return bits.join(' ');
}

/* ---------- Compromisos adquiridos a mitad de temporada ----------
   Si das tu palabra en enero, en verano se cumple: no vuelve a haber elección. */
function commitTo(G, club, reason) {
  if (!club) return '';
  G.committedTo = { clubId: club.id, reason };
  return 'Acuerdo cerrado con el ' + club.name + '. En verano firmas allí, pase lo que pase.';
}

/* Fichaje de invierno de verdad: te vas en enero y juegas media temporada allí */
function moveInWinter(G, club) {
  if (!club) return '';
  const nr = squadRole(G.player, club);
  G.winterMove = { clubId: club.id, years: ri(3, 4), wage: wageFor(club, G.player, nr.key) };
  return 'Te vas al ' + club.name + ' en el mercado de invierno. La media temporada que queda la juegas allí.';
}

/* Un pretendiente coherente con tu momento, para las ofertas que nacen de un evento.
   `step` marca cuánto mejor que tu club actual queremos que sea. */
function suitorClub(G, step) {
  const p = G.player;
  const cur = G.club;
  const base = mainClub(cur) || cur;
  const ctx = {
    stature: p.ovr + clamp((p.rep - 40) * 0.12, -4, 8) + clamp(p.form / 9, -3, 4) + (step || 0),
    mins: 2000, rating: 6.8, goals: 0, assists: 0,
  };
  const pool = [];
  for (const c of CLUBS) {
    if (c.id === base.id) continue;
    if (step > 0 && c.str <= base.str + 1) continue;
    const f = clubFeasibility(G, c, ctx);
    if (f > 0.03) pool.push({ c, f });
  }
  if (!pool.length) return null;
  return pickW(pool, (x) => x.f * (1 + x.c.prestige / 150)).c;
}

/* ---------- Aplicar el movimiento ---------- */
function applyMove(G, opt) {
  const p = G.player;
  if (opt.type === 'retire') { p.retired = true; return; }
  const prev = G.club;

  if (opt.type === 'loan') {
    p.loanFrom = opt.backTo;
    p.loanYears = (opt.loanYears || 1) - 1;
  } else if (opt.type === 'stay' && p.loanFrom) {
    p.loanYears = Math.max(0, (p.loanYears || 1) - 1);   // la cesión sigue corriendo
  } else {
    p.loanFrom = null; p.loanYears = 0;
  }

  p.seasonsAtClub = (prev && opt.club && prev.id === opt.club.id) ? (p.seasonsAtClub || 0) + 1 : 0;
  G.club = opt.club;
  p.contract = opt.years || 2;
  p.wage = opt.wage || 0.05;
  if (p.flags) { delete p.flags.wantOut; delete p.flags.forceMove; }
  if (prev && opt.club && prev.id !== opt.club.id) {
    p.trust = clamp(52 + rf(-6, 10), 30, 80);
    p.fanLove = opt.type === 'promote' || opt.type === 'return' ? 62 : clamp(50 + rf(-8, 10), 25, 75);
    p.morale = clamp(p.morale + (opt.club.prestige > (prev.prestige || 0) ? 8 : -2), 25, 100);
  }
  p.value = playerValue(p);
}


/* ===== engine.awards.js ===== */
/* ============================================================
   PREMIOS INDIVIDUALES Y SELECCION NACIONAL
   ============================================================ */

const TITLE_POINTS = {
  'UEFA Champions League': 32, 'Copa Libertadores': 22, 'Concacaf Champions Cup': 10,
  'AFC Champions League Elite': 10, 'UEFA Europa League': 12, 'Copa Sudamericana': 8,
  'UEFA Conference League': 6, 'Mundial': 42, 'Eurocopa': 26, 'Copa América': 24,
  'Copa Africana de Naciones': 14, 'Copa Oro': 8, 'Copa Asiática': 8,
};
function titlePoints(name, leagueName) {
  if (TITLE_POINTS[name]) return TITLE_POINTS[name];
  if (name === leagueName) return 14;
  if (/[Aa]scenso/.test(name)) return 3;
  if (/Copa|Cup|Pokal/.test(name)) return 6;
  if (/Supercopa|Shield|Campeones/.test(name)) return 3;
  return 4;
}

/* ---------- Premios de la temporada ---------- */
function computeAwards(G, rep) {
  const p = G.player;
  const s = rep.stats;
  const lg = rep.league;
  const club = rep.club;
  const out = [];
  if (s.mins < 700 || club.academy) return out;

  const lw = clamp((lg ? lg.rep : 65) / 88, 0.5, 1.15);        // peso de la liga
  const ga = s.goals + s.assists * 0.75;

  /* Máximo goleador de la liga */
  if (p.pos !== 'GK') {
    const need = Math.round(gauss(9 + lw * 14, 2.6, 8, 34));
    if (s.goals >= need && s.goals >= 12) {
      out.push({ name: 'Máximo goleador de ' + (lg ? lg.name : 'la liga'), icon: '👟', kind: 'boot', pts: 8 });
    }
    const needA = Math.round(gauss(8 + lw * 5, 2, 6, 20));
    if (s.assists >= needA && s.assists >= 9) {
      out.push({ name: 'Máximo asistente de ' + (lg ? lg.name : 'la liga'), icon: '🎩', kind: 'assist', pts: 6 });
    }
  }

  /* Portero menos goleado */
  if (p.pos === 'GK' && s.cs >= Math.round(gauss(13, 2.4, 9, 22)) && s.apps >= 25) {
    out.push({ name: 'Zamora / portero menos goleado', icon: '🧤', kind: 'gk', pts: 7 });
  }

  /* MVP de la liga */
  const mvpScore = (p.ovr - 76) * 3 + ga * 1.4 * lw + (rep.leaguePos <= 2 ? 16 : rep.leaguePos <= 5 ? 7 : 0) + (s.rating - 7) * 26;
  if (mvpScore >= gauss(62, 9, 42, 92) && p.ovr >= 82) {
    out.push({ name: 'MVP de ' + (lg ? lg.name : 'la liga'), icon: '⭐', kind: 'mvp', pts: 11 });
  }

  /* Once ideal */
  if (mvpScore >= gauss(40, 8, 24, 64) && p.ovr >= 78) {
    out.push({ name: 'Once ideal de ' + (lg ? lg.name : 'la liga'), icon: '🧩', kind: 'toty', pts: 5 });
  }

  /* Mejor joven */
  if (p.age <= 21 && mvpScore >= gauss(20, 6, 10, 40)) {
    out.push({ name: 'Mejor jugador joven de ' + (lg ? lg.name : 'la liga'), icon: '🌟', kind: 'young', pts: 5 });
  }
  if (p.age <= 21 && p.ovr >= 82 && mvpScore >= gauss(42, 8, 26, 70)) {
    out.push({ name: 'Golden Boy', icon: '🏅', kind: 'goldenboy', pts: 12 });
  }

  /* Puskás */
  if (s.goals >= 8 && chance(0.05 + Math.min(0.09, s.goals / 400))) {
    out.push({ name: 'Premio Puskás al mejor gol', icon: '🎬', kind: 'puskas', pts: 5 });
  }

  /* Balón de Oro */
  let ballon = 0;
  ballon += (p.ovr - 84) * 3;
  ballon += ga * 1.25 * lw;
  ballon += (s.rating - 7) * 20;
  (rep.titles || []).forEach((t) => { ballon += titlePoints(t.name, lg ? lg.name : '') * 0.95; });
  (rep.ntTitles || []).forEach((t) => { ballon += titlePoints(t.name, '') * 1.0; });
  ballon += clamp((club.prestige - 78) * 0.35, 0, 8);
  ballon += clamp((p.rep - 60) * 0.2, 0, 10);
  if (p.pos === 'GK') ballon *= 0.55;
  if (p.pos === 'CB' || p.pos === 'DM' || p.pos === 'LB' || p.pos === 'RB') ballon *= 0.78;
  rep.ballonScore = Math.round(ballon);

  const threshold = gauss(134, 11, 105, 165);
  if (p.ovr >= 88 && ballon >= threshold) {
    out.push({ name: 'BALÓN DE ORO', icon: '🥇', kind: 'ballon', pts: 40 });
  } else if (p.ovr >= 85 && ballon >= threshold - 26) {
    out.push({ name: 'Podio del Balón de Oro (' + (ballon >= threshold - 12 ? '2º' : '3º') + ')', icon: '🥈', kind: 'ballon3', pts: 14 });
  } else if (p.ovr >= 82 && ballon >= threshold - 52) {
    out.push({ name: 'Nominado al Balón de Oro', icon: '📜', kind: 'ballonNom', pts: 5 });
  }

  return out;
}

/* ---------- Seleccion nacional ---------- */
const NT_THRESHOLD = { 1: 83.5, 2: 78.5, 3: 74, 4: 70, 5: 66, 6: 61 };

function ntEvaluate(G, rep) {
  const p = G.player;
  const country = COUNTRY_BY_CODE[p.country];
  const lg = rep.league;
  const s = rep.stats;
  const res = { called: false, level: null, caps: 0, goals: 0, tournaments: [], titles: [], feed: [] };

  // La media manda. Todo lo demas son ajustes pequenios: el tope del bono es +6.
  let bonus = 0;
  bonus += clamp(((lg ? lg.rep : 60) - 74) * 0.09, -3, 2);
  bonus += clamp((s.rating - 6.8) * 4, -5, 4);
  bonus += Math.min(3, s.goals * (p.pos === 'GK' ? 0 : 0.14) + s.assists * 0.1);
  bonus += clamp((p.rep - 50) * 0.03, -1.5, 2);
  if (p.nt.streak > 0) bonus += 1.5;                          // ya eres del grupo
  if (p.traits.includes('leader')) bonus += 0.5;
  if (s.mins < 800) bonus -= 8;
  if (p.age >= 33) bonus -= (p.age - 32) * 2.4;
  const score = p.ovr + clamp(bonus, -16, 6);

  const th = NT_THRESHOLD[country.tier];

  /* categorias inferiores */
  if (p.age <= 21) {
    const youthTh = th - (p.age <= 17 ? 16 : p.age <= 19 ? 12 : 8);
    if (score >= youthTh) {
      const lvl = p.age <= 17 ? 'Sub-17' : p.age <= 19 ? 'Sub-19' : 'Sub-21';
      res.called = true; res.level = lvl;
      res.caps = ri(3, 9);
      res.goals = p.pos === 'GK' ? 0 : poisson(POS_BY_KEY[p.pos].g * res.caps * 0.85);
      res.feed.push({ icon: '🌱', cls: 'info', text: `Convocado con la selección ${country.flag} ${lvl}. ${res.caps} partidos, ${res.goals} goles.` });
    }
  }

  /* absoluta */
  if (score >= th && p.age >= 17) {
    res.called = true; res.level = 'Absoluta';
    p.nt.streak++;
    res.caps = ri(5, 13);
    res.goals = p.pos === 'GK' ? 0 : poisson(POS_BY_KEY[p.pos].g * res.caps * 0.75);
    if (p.nt.caps === 0) res.feed.push({ icon: '🎽', cls: 'gold', text: `¡DEBUT ABSOLUTO con ${country.flag} ${country.name}! Un día que no se olvida.` });
    res.feed.push({ icon: '🌐', cls: 'info', text: `${res.caps} internacionalidades esta temporada con ${country.flag} ${country.name}${res.goals ? ` y ${res.goals} gol${res.goals > 1 ? 'es' : ''}` : ''}.` });
  } else if (p.nt.streak > 0 && res.level !== 'Absoluta') {
    p.nt.streak = 0;
    if (p.nt.caps > 0) res.feed.push({ icon: '📉', cls: 'bad', text: `Te quedas fuera de la lista de ${country.flag} ${country.name}.` });
  }

  /* torneos del verano */
  const year = G.seasonStart + 1;
  if (res.level === 'Absoluta') {
    tournamentsInYear(year, country.confed).forEach((t) => {
      const r = simulateNTTournament(G, t, country, p);
      res.tournaments.push(r);
      if (r.won) res.titles.push({ name: t.name, icon: t.emoji, tier: t.prestige >= 88 ? 4 : 3, nt: true });
      res.feed.push({
        icon: t.emoji, cls: r.won ? 'gold' : r.stage === 'subcampeón' ? 'info' : 'info',
        text: `${t.name}: ${country.flag} ${country.name} ${stagePhrase(r.stage)}. ${r.caps} partidos, ${r.goals} goles${r.motm ? `, ${r.motm} MVP` : ''}.`,
      });
    });
  } else if (p.age <= 23 && res.called) {
    youthTournamentsInYear(year, country.confed).filter((t) => p.age <= t.maxAge).forEach((t) => {
      if (!chance(0.6)) return;
      const won = chance(0.10 + (6 - country.tier) * 0.02);
      res.feed.push({ icon: t.emoji, cls: won ? 'gold' : 'info', text: `${t.name}: ${won ? '¡CAMPEÓN!' : roundPhrase(rnd(), true)}.` });
      if (won) res.titles.push({ name: t.name, icon: t.emoji, tier: 2, nt: true });
    });
  }

  return res;
}

const CONFED_FLOOR = { UEFA: 1, CONMEBOL: 1, CONCACAF: 2, CAF: 2, AFC: 2, OFC: 5 };
function simulateNTTournament(G, t, country, p) {
  const isWorld = t.confed === '*';
  const tierRel = isWorld ? country.tier : clamp(country.tier - (CONFED_FLOOR[country.confed] || 1) + 1, 1, 6);
  const baseWin = isWorld
    ? [0.075, 0.022, 0.008, 0.003, 0.0010, 0.0003][tierRel - 1]
    : [0.21, 0.12, 0.058, 0.024, 0.009, 0.003][tierRel - 1];
  // un crack arrastra a su seleccion, pero no la gana el solo
  const boost = 1 + clamp((p.ovr - 84) * 0.035, 0, 0.5) + (p.traits.includes('clutch') ? 0.1 : 0);
  const win = clamp(baseWin * boost, 0.0004, 0.6);
  const roll = rnd();
  let stage;
  if (roll < win) stage = 'campeón';
  else if (roll < win * 2.1) stage = 'subcampeón';
  else if (roll < win * 4.2) stage = 'semifinalista';
  else if (roll < win * 8) stage = 'cuartofinalista';
  else if (roll < win * 15 + 0.12) stage = 'eliminado en octavos';
  else stage = 'eliminado en la fase de grupos';
  const caps = stage === 'campeón' || stage === 'subcampeón' ? ri(6, 7)
    : stage.includes('semi') ? ri(5, 6) : stage.includes('cuartos') ? ri(4, 5)
      : stage.includes('octavos') ? ri(3, 4) : ri(2, 3);
  const goals = p.pos === 'GK' ? 0 : poisson(POS_BY_KEY[p.pos].g * caps * Math.pow(p.ovr / 78, 2));
  const motm = poisson(clamp((p.ovr - 80) / 22, 0, 1) * caps * 0.25);
  return { stage, won: stage === 'campeón', caps, goals, motm, name: t.name, prestige: t.prestige };
}

/* ---------- Reputacion ---------- */
function updateReputation(G, rep, awards, nt) {
  const p = G.player;
  const s = rep.stats;
  let d = 0;
  d += clamp((s.rating - 6.6) * 6, -6, 9);
  d += Math.min(10, (s.goals + s.assists * 0.6) * 0.35);
  d += (rep.titles || []).reduce((a, t) => a + titlePoints(t.name, rep.league ? rep.league.name : '') * 0.22, 0);
  d += awards.reduce((a, x) => a + x.pts * 0.55, 0);
  d += (nt.level === 'Absoluta' ? 3 : nt.level ? 1 : 0);
  d += clamp((p.ovr - 74) * 0.35, -3, 6);
  d += clamp(((rep.league ? rep.league.rep : 60) - 72) * 0.05, -2, 2);
  if (s.mins < 500) d -= 6;
  if (p.traits.includes('mediastar')) d *= 1.2;
  // la fama se evapora: cuanto mas lejos estas de tu mejor version, mas rapido te olvidan
  const fade = 1.2 + Math.max(0, (p.peakOvr || p.ovr) - p.ovr) * 0.55 + Math.max(0, p.age - 31) * 0.6;
  p.rep = clamp(p.rep + d * 0.62 - fade, 1, 100);
}

/* ---------- Legado y retirada ---------- */
function computeLegacy(G) {
  const p = G.player, c = p.career;
  let L = 0;
  L += c.apps * 0.28;
  L += c.goals * 1.5 + c.assists * 1.0;
  L += (c.cs || 0) * 1.1 + (c.saves || 0) * 0.05;
  L += c.ntApps * 1.4 + c.ntGoals * 2.4;
  p.trophies.forEach((t) => { L += titlePoints(t.name, '') * 2.6; });
  p.awards.forEach((a) => { L += a.pts * 3.4; });
  L += Math.max(0, p.peakOvr - 70) * 9;
  L += c.motm * 1.2;
  return Math.round(L);
}
function legacyRank(L) {
  if (L >= 3400) return { t: 'INMORTAL', d: 'Tu nombre está en la conversación del mejor de la historia.', icon: '👑', color: 'gold' };
  if (L >= 2400) return { t: 'LEYENDA MUNDIAL', d: 'Generaciones enteras crecerán viendo tus vídeos.', icon: '🏆', color: 'gold' };
  if (L >= 1600) return { t: 'ICONO', d: 'Un grande de tu época. Tu camiseta se sigue vendiendo.', icon: '⭐', color: 'purple' };
  if (L >= 1000) return { t: 'LEYENDA DE CLUB', d: 'En tu casa tienen tu nombre en una grada.', icon: '💚', color: 'acc' };
  if (L >= 600) return { t: 'PROFESIONAL DE ÉLITE', d: 'Una carrera larga y respetada en la primera línea.', icon: '🎽', color: 'blue' };
  if (L >= 300) return { t: 'HONRADO PROFESIONAL', d: 'Viviste del fútbol. No todo el mundo puede decirlo.', icon: '⚽', color: '' };
  return { t: 'UNO MÁS', d: 'El fútbol es cruel. Lo intentaste.', icon: '🌧️', color: 'dim' };
}

/* ---------- Récords personales ---------- */
function updateRecords(G, rep) {
  const p = G.player, s = rep.stats;
  p.records = p.records || {};
  const r = p.records;
  const better = (key, val, extra) => {
    if (val > (r[key] ? r[key].v : -1)) r[key] = { v: val, season: seasonLabel(G), club: rep.club.name, ...extra };
  };
  better('goals', s.goals);
  better('assists', s.assists);
  better('apps', s.apps);
  better('rating', s.rating);
  if (p.pos === 'GK') { better('cs', s.cs); better('saves', s.saves); }
}
/* Qué récords se han batido esta temporada (se llama ANTES de actualizarlos) */
function brokenRecords(G, rep) {
  const p = G.player, s = rep.stats, r = p.records || {};
  const out = [];
  const chk = (key, val, label, fmt) => {
    if (!r[key] || val <= r[key].v) return;
    if (val <= 0) return;
    out.push(`${label} (${fmt ? fmt(val) : val}, antes ${fmt ? fmt(r[key].v) : r[key].v})`);
  };
  chk('goals', s.goals, 'más goles en una temporada');
  chk('assists', s.assists, 'más asistencias en una temporada');
  chk('rating', s.rating, 'mejor nota media', (v) => v.toFixed(2));
  if (p.pos === 'GK') chk('cs', s.cs, 'más porterías a cero');
  return out;
}

/* ---------- Destacados de la temporada ----------
   Se deducen de los números reales, así que nunca cuentan algo que no pasó. */
function seasonHighlights(G, rep) {
  const p = G.player, s = rep.stats;
  const out = [];
  const club = rep.club.name;
  if (s.apps < 5) return out;

  if (p.pos !== 'GK' && s.goals >= 10) {
    const hats = poisson(s.goals / 14);
    if (hats >= 1) out.push({ icon: '🎩', cls: 'good', text: hats === 1
      ? `Firmaste un <b>hat-trick</b> esta temporada.`
      : `<b>${hats} hat-tricks</b> en una sola temporada.` });
  }
  if (p.pos !== 'GK' && s.goals >= 6 && chance(0.55)) {
    const streak = clamp(2 + poisson(s.goals / 11), 2, 9);
    out.push({ icon: '🔥', cls: 'good', text: `Marcaste en <b>${streak} partidos seguidos</b>.` });
  }
  if (p.pos !== 'GK' && s.goals >= 3 && chance(0.45)) {
    out.push({ icon: '⏱️', cls: 'good', text: pick([
      `Un gol tuyo en el minuto 90 dio tres puntos al ${club}.`,
      `Marcaste el gol de la victoria en el derbi.`,
      `Un golazo desde fuera del área tuyo abrió los informativos.`,
      `Marcaste en el último suspiro para forzar un empate imposible.`,
    ]) });
  }
  if (s.assists >= 6 && chance(0.5)) {
    out.push({ icon: '🪄', cls: 'good', text: pick([
      `Diste tres asistencias en un mismo partido.`,
      `Tu pase del año se ha visto en todos los resúmenes.`,
      `Repartiste asistencias en cuatro jornadas consecutivas.`,
    ]) });
  }
  if (p.pos === 'GK' && s.saves >= 60 && chance(0.6)) {
    out.push({ icon: '🧤', cls: 'good', text: pick([
      `Hiciste <b>nueve paradas</b> en un solo partido y os salvaste con un punto.`,
      `Encadenaste <b>cinco porterías a cero</b> seguidas.`,
      `Paraste un penalti en el descuento.`,
    ]) });
  }
  if (s.rating >= 7.6 && chance(0.5)) {
    out.push({ icon: '📰', cls: 'info', text: `La prensa te ha metido en el once ideal de la jornada ${ri(3, 9)} veces.` });
  }
  if (s.red >= 1) out.push({ icon: '🟥', cls: 'bad', text: `Viste una <b>roja directa</b> que te costó sanción.` });
  if (s.apps > 10 && s.rating <= 6.2) out.push({ icon: '📉', cls: 'bad', text: `La afición te señaló como uno de los puntos débiles del equipo.` });
  return shuffle(out).slice(0, 3);
}

/* ---------- Ventajas desbloqueables ----------
   Lo que se gana en una carrera sirve para la siguiente: engancha a volver a jugar. */
const PERKS = [

  { id: 'scout', need: 400, icon: '🔎', name: 'Ojo de ojeador', desc: 'Las opciones iniciales incluyen clubes algo mejores.' },

  { id: 'contacts', need: 2200, icon: '📇', name: 'Agenda de contactos', desc: 'Empiezas con superagente: más y mejores ofertas toda la carrera.' },

  { id: 'prodigy', need: 6000, icon: '✨', name: 'Prodigio', desc: '+7 al techo y empiezas dos puntos por encima.' },
];
function unlockedPerks(meta) {
  const total = (meta.hall || []).reduce((a, h) => a + (h.legacy || 0), 0);
  return { total, list: PERKS.map((p) => ({ ...p, unlocked: total >= p.need })) };
}
function applyPerk(p, perkId) {
  switch (perkId) {
    case 'body': if (!p.traits.includes('ironman')) p.traits.push('ironman'); break;
    case 'contacts': p.flags.superAgent = 1; break;
    case 'genes': p.pot = clamp(p.pot + 4, 40, 99); break;
    case 'prodigy':
      p.pot = clamp(p.pot + 7, 40, 99);
      Object.keys(p.attrs).forEach((k) => { p.attrs[k] = clamp(p.attrs[k] + 2, 20, 99); });
      p.ovr = computeOvr(p);
      break;
    default: break;
  }
  p.perk = perkId;
}

/* ---------- Reto del Día ----------
   Todo el mundo que juegue hoy arranca exactamente con las mismas condiciones y
   la misma semilla. Lo que cambie el resultado serán tus decisiones, no la suerte.
   Al terminar sale una tarjeta de texto para pegar en el grupo. */
function todayKey(d) {
  const t = d || new Date();
  return t.getUTCFullYear() * 10000 + (t.getUTCMonth() + 1) * 100 + t.getUTCDate();
}
function dailySeed(key) {
  let h = 2166136261 ^ (key >>> 0);
  for (let i = 0; i < 4; i++) { h = Math.imul(h ^ (h >>> 13), 16777619); }
  return h >>> 0;
}
/* Genera las condiciones del reto de forma determinista */
function dailyChallenge(key) {
  const saved = RNG_STATE;
  seedRng(dailySeed(key));
  const pool = COUNTRIES.filter((c) => c.tier >= 2);
  const country = pick(pool);
  const pos = pick(POSITIONS).key;
  const archKeys = Object.keys(ARCHETYPES);
  const arch = pick(archKeys);
  const twists = [
    { id: 'none', name: 'Sin restricciones', desc: 'La carrera tal cual. Que hable el talento.' },
    { id: 'hard', name: 'Sin red', desc: 'Empiezas en el club más modesto de los tres.' },

    { id: 'exile', name: 'Exiliado', desc: 'Empiezas obligatoriamente fuera de tu país.' },
  ];
  const twist = pick(twists);
  const goalPool = [
    { id: 'ucl', name: 'Ganar la Champions', check: (p) => p.trophies.some((t) => t.name === 'UEFA Champions League') },
    { id: 'ballon', name: 'Ganar el Balón de Oro', check: (p) => p.awards.some((a) => a.kind === 'ballon') },
    { id: 'ovr90', name: 'Llegar a 90 de media', check: (p) => p.peakOvr >= 90 },
    { id: 'nt', name: 'Jugar 50 partidos con tu selección', check: (p) => p.career.ntApps >= 50 },
    { id: 'trophies', name: 'Ganar 12 títulos', check: (p) => p.career.trophies >= 12 },
    { id: 'goals', name: 'Marcar 200 goles', check: (p) => p.career.goals >= 200 },
  ];
  const goal = pick(goalPool.filter((g) => !(pos === 'GK' && (g.id === 'goals' || g.id === 'ballon'))));
  RNG_STATE = saved;
  return { key, seed: dailySeed(key), country, pos, arch, twist, goal };
}

/* Puntuación del reto: legado más bonus por cumplir el objetivo */
function challengeScore(G) {
  const p = G.player;
  const base = computeLegacy(G) + (p.legacyExtra || 0);
  const ch = G.challenge;
  const done = ch && ch.goal.check(p);
  return { score: Math.round(base * (done ? 1.5 : 1)), base, goalDone: !!done };
}

/* ---------- Gráfica de la evolución de la media ---------- */
function ovrSparkline(history, w, h) {
  const rows = history.filter((x) => x.ovr != null);
  if (rows.length < 2) return '';
  const W = w || 300, H = h || 74, pad = 6;
  const vals = rows.map((r) => r.ovr);
  const lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 2;
  const x = (i) => pad + (i / (rows.length - 1)) * (W - pad * 2);
  const y = (v) => H - pad - ((v - lo) / Math.max(1, hi - lo)) * (H - pad * 2);
  const line = rows.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r.ovr).toFixed(1)}`).join(' ');
  const area = `${line} L${x(rows.length - 1).toFixed(1)},${H - pad} L${x(0).toFixed(1)},${H - pad} Z`;
  const peakI = vals.indexOf(Math.max(...vals));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block" aria-label="Evolución de la media">
    <defs><linearGradient id="spk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee66b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2ee66b" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#spk)"/>
    <path d="${line}" fill="none" stroke="#2ee66b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(peakI).toFixed(1)}" cy="${y(vals[peakI]).toFixed(1)}" r="3.6" fill="#ffc93c"/>
    <text x="${x(peakI).toFixed(1)}" y="${(y(vals[peakI]) - 7).toFixed(1)}" text-anchor="middle"
      font-family="Inter,sans-serif" font-size="11" font-weight="800" fill="#ffc93c">${vals[peakI]}</text>
  </svg>`;
}

/* ---------- Aplicar efectos ---------- */
function applyEffects(G, raw) {
  const p = G.player;
  let e = typeof raw === 'function' ? raw(G) : raw;
  if (!e) return '';
  const add = (k, v) => { p[k] = clamp((p[k] || 0) + v, 0, 100); };
  if (e.morale) add('morale', e.morale);
  if (e.trust) add('trust', e.trust);
  if (e.fanLove) add('fanLove', e.fanLove);
  if (e.fitness) add('fitness', e.fitness);
  if (e.rep) p.rep = clamp(p.rep + e.rep, 1, 100);
  if (e.form) p.form = clamp(p.form + e.form, -60, 60);
  if (e.sp) p.sp += e.sp;
  if (e.money) p.money = Math.max(-5, (p.money || 0) + e.money);
  if (e.wageCut) p.wage *= e.wageCut;
  if (e.legacyBonus) p.legacyExtra = (p.legacyExtra || 0) + e.legacyBonus;
  if (e.attr) for (const k in e.attr) if (p.attrs[k] != null) p.attrs[k] = clamp(p.attrs[k] + e.attr[k], 20, 99);
  if (e.trait && !p.traits.includes(e.trait)) p.traits.push(e.trait);
  if (e.lose) p.traits = p.traits.filter((t) => t !== e.lose);
  if (e.flag) p.flags[e.flag] = 1;
  const m = G.mods;
  ['goals', 'assists', 'mins', 'growth', 'injuryRisk'].forEach((k) => { if (e[k]) m[k] = (m[k] || 1) * e[k]; });
  if (e.rating) m.rating = (m.rating || 0) + e.rating;
  if (e.extraGoals) m.extraGoals = (m.extraGoals || 0) + e.extraGoals;
  p.ovr = computeOvr(p);
  p.value = playerValue(p);
  return e.note || '';
}

function freshMods() {
  return { goals: 1, assists: 1, mins: 1, growth: 1, injuryRisk: 1, rating: 0, extraGoals: 0 };
}

/* ---------- Peso de una decisión y sus consecuencias ----------
   El problema no era la estética, era no saber qué te juegas al pulsar. Esto lo
   deduce del propio efecto, así que ningún evento puede mentir sobre lo que hace. */
const IMPORTANCE = {
  1: { name: 'Decisión menor', cls: '', color: 'var(--dim2)' },
  2: { name: 'Decisión importante', cls: 'imp-2', color: 'var(--gold)' },
  3: { name: 'DECISIÓN CRUCIAL', cls: 'imp-3', color: 'var(--red)' },
};
function optionImportance(o) {
  let n = 1;
  if (o.tags && o.tags.some((t) => /compromete|cambias de club|ya\b/i.test(t))) n = 3;
  const e = typeof o.e === 'function' ? null : o.e;
  if (!e) return Math.max(n, 2);                       // hay azar de por medio
  if (e.trait || e.lose) n = Math.max(n, 2);
  const mag = Math.abs(e.morale || 0) + Math.abs(e.trust || 0) + Math.abs(e.fanLove || 0) + Math.abs(e.rep || 0);
  if (mag >= 18) n = Math.max(n, 2);
  if (mag >= 34) n = Math.max(n, 3);
  ['mins', 'growth', 'injuryRisk', 'goals', 'assists'].forEach((k) => {
    if (e[k] != null && Math.abs(e[k] - 1) >= 0.15) n = Math.max(n, 2);
    if (e[k] != null && Math.abs(e[k] - 1) >= 0.35) n = Math.max(n, 3);
  });
  return n;
}
function eventImportance(ev) {
  return (ev.opts || []).reduce((m, o) => Math.max(m, optionImportance(o)), 1);
}

/* Etiquetas legibles de lo que hace cada efecto */
const FX_LABEL = {
  growth: 'Crecimiento', mins: 'Minutos', goals: 'Goles', assists: 'Asistencias',
  injuryRisk: 'Riesgo de lesión', morale: 'Moral', trust: 'Confianza del míster',
  fanLove: 'Afición', rep: 'Fama', fitness: 'Estado físico', money: 'Dinero',
  form: 'Racha', rating: 'Rendimiento', sp: 'Puntos de evolución', extraGoals: 'Gol asegurado',
};
const FX_MULT = ['growth', 'mins', 'goals', 'assists', 'injuryRisk'];
function effectChips(o) {
  if (o.tags && o.tags.length) {
    return o.tags.map((t) => chip(t, /compromete|cambias/i.test(t) ? 'bad' : 'warn')).join('');
  }
  const e = typeof o.e === 'function' ? null : o.e;
  if (!e) return chip('🎲 Puede salir bien o mal', 'warn');
  const out = [];
  const push = (label, up, good) => out.push(chip((up ? '▲ ' : '▼ ') + label, good ? 'on' : 'bad'));
  FX_MULT.forEach((k) => {
    if (e[k] == null || Math.abs(e[k] - 1) < 0.02) return;
    const up = e[k] > 1;
    push(FX_LABEL[k], up, k === 'injuryRisk' ? !up : up);
  });
  ['morale', 'trust', 'fanLove', 'rep', 'fitness', 'money', 'form', 'rating', 'sp', 'extraGoals'].forEach((k) => {
    if (!e[k]) return;
    if (Math.abs(e[k]) < (k === 'rating' ? 0.03 : k === 'money' ? 0.05 : 3)) return;
    push(FX_LABEL[k], e[k] > 0, e[k] > 0);
  });
  if (e.trait && TRAITS[e.trait]) out.push(chip(TRAITS[e.trait].icon + ' ' + TRAITS[e.trait].name, TRAITS[e.trait].bad ? 'bad' : 'on'));
  if (e.attr) {
    const ups = Object.keys(e.attr).filter((k) => e.attr[k] > 0);
    if (ups.length) out.push(chip('▲ ' + ups.map((k) => attrName(k)).join(', '), 'on'));
  }
  if (!out.length) out.push(chip('Sin efectos notables', ''));
  return out.slice(0, 5).join('');
}

function saveGame(G) {

      v: 1, seasonStart: G.seasonStart, player: G.player, clubId: G.club ? G.club.id : null,
      clubAcademy: G.club && G.club.academy ? G.club.parent : null,

      committedTo: G.committedTo, winterMove: G.winterMove, lastStature: G.lastStature,
      challengeKey: G.challenge ? G.challenge.key : null,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch (err) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const G = {
      seasonStart: d.seasonStart, player: d.player,
      club: d.clubAcademy ? academyOf(getClub(d.clubAcademy)) : getClub(d.clubId),
      world: d.world || {}, euro: d.euro || {}, euroPool: d.euroPool || {},
      mods: d.mods || freshMods(), objectives: d.objectives || [],
      step: d.step || 'season', queue: deserializeQueue(d.queue || []),
      seasonFeed: d.seasonFeed || [],
      squad: d.squad || null, squadClubId: d.squadClubId || null,
      committedTo: d.committedTo || null, winterMove: d.winterMove || null, lastStature: d.lastStature || 0,
      challenge: d.challengeKey ? dailyChallenge(d.challengeKey) : null,
    };
    // sanear
    if (!G.club) return null;
    G.player.arcs = G.player.arcs || {};
    G.player.flags = G.player.flags || {};
    return G;
  } catch (e) { return null; }
}
function serializeQueue(q) { return (q || []).map((b) => ({ t: b.t, id: b.id || null, arcId: b.arcId || null })); }
function deserializeQueue(q) {
  return q.map((b) => {
    if (b.t === 'event') return { t: 'event', id: b.id, ev: EVENTS.find((e) => e.id === b.id) };
    if (b.t === 'moment') return { t: 'moment', id: b.id, m: MOMENTS.find((e) => e.id === b.id) };
    if (b.t === 'story') return { t: 'story', arcId: b.arcId };
    return b;
  }).filter((b) => b.t === 'preseason' || b.ev || b.m || b.arcId);
}

function applyTwist(G, opts) {
  const ch = G.challenge;
  if (!ch || ch.twist.id === 'none') return opts;
  const home = G.player.country;
  let out = opts;
  if (ch.twist.id === 'home') out = opts.filter((o) => (o.parent || o.club).country === home);
  else if (ch.twist.id === 'exile') out = opts.filter((o) => (o.parent || o.club).country !== home);
  else if (ch.twist.id === 'hard') {
    const worst = opts.slice().sort((a, b) => a.club.str - b.club.str)[0];
    out = worst ? [worst] : opts;
  }
  return out.length ? out : opts;
}

/* ============================================================
   FLUJO DE JUEGO: temporada a temporada
   ============================================================ */

function renderStep() {
  const G = window.G;
  if (!G) return screenHome();
  if (G.player.retired) return screenRetired();
  switch (G.step) {
    case 'beat': return screenBeat();
    case 'sim': return screenSimulating();
    case 'report': return screenReport();
    case 'develop': return screenDevelop();
    case 'market': return screenMarket();
    default: return screenBeat();
  }
}

/* ---------- Arranque de temporada ---------- */
function startSeason(G, first) {
  const p = G.player;
  G.mods = freshMods();
  if (p.startClubId && G.club.id === p.startClubId) {
    G.mods.mins *= (p.startMinsMod || 1);
    G.mods.growth *= (p.startDev || 1);
  } else if (first) {
    p.startClubId = G.club.id;
    G.mods.mins *= (p.startMinsMod || 1);
    G.mods.growth *= (p.startDev || 1);
  }
  syncSquad(G);
  G.objectives = makeObjectives(G);
  G.seasonFeed = [];
  G.queue = buildQueue(G, first);
  G.step = 'beat';
  saveGame(G);
  renderStep();
}

function buildQueue(G, first) {
  const p = G.player;
  p.usedEvents = p.usedEvents || {};
  const season = p.career.seasons;
  const q = [{ t: 'preseason' }];

  /* eventos */
  const pool = EVENTS.filter((e) => {
    if (e.when && !e.when(G)) return false;
    const last = p.usedEvents[e.id];
    return last == null || season - last >= 5;
  });
  const nEv = first ? 2 : ri(2, 4);
  const chosen = [];
  for (let i = 0; i < nEv && pool.length; i++) {
    const e = pickW(pool.filter((x) => !chosen.includes(x)), (x) => x.w || 5);
    if (!e) break;
    chosen.push(e);
  }
  chosen.forEach((e) => { p.usedEvents[e.id] = season; });

  /* momentos clave */
  const mpool = MOMENTS.filter((m) => !m.when || m.when(G));
  const nMo = first ? 1 : ri(1, 2);
  const moms = [];
  for (let i = 0; i < nMo && mpool.length; i++) {
    const m = pick(mpool.filter((x) => !moms.includes(x)) || mpool);
    if (m) moms.push(m);
  }
  if (first) { const deb = MOMENTS.find((m) => m.id === 'debut'); if (deb) { moms.length = 0; moms.push(deb); } }

  /* trama larga */
  const beats = [];
  chosen.forEach((e) => beats.push({ t: 'event', id: e.id, ev: e }));
  moms.forEach((m) => beats.push({ t: 'moment', id: m.id, m }));

  const activeArc = Object.keys(p.arcs).find((k) => p.arcs[k] && !p.arcs[k].done);
  if (activeArc && chance(0.75)) beats.push({ t: 'story', arcId: activeArc });
  else if (!activeArc) {
    const cands = STORYLINES.filter((s) => !p.arcs[s.id] && s.start(G));
    if (cands.length && chance(0.62)) {
      const s = pick(cands);
      p.arcs[s.id] = { stage: 0, data: s.init ? s.init(G) : {}, done: false };
      beats.push({ t: 'story', arcId: s.id });
    }
  }
  return q.concat(shuffle(beats));
}

function screenBeat() {
  const G = window.G;
  if (!G.queue.length) { G.step = 'sim'; return renderStep(); }
  const b = G.queue[0];
  if (b.t === 'preseason') return screenPreseason();
  if (b.t === 'event') return screenEvent(b.ev);
  if (b.t === 'moment') return screenMoment(b.m);
  if (b.t === 'story') return screenStory(b.arcId);
  G.queue.shift(); return renderStep();

function screenSimulating() {
  const G = window.G;
  screen(`${topbar(G)}

function runSimulation() {
  const G = window.G, p = G.player;
  const rep = simulateSeason(G);
  const nt = ntEvaluate(G, rep);
  rep.ntTitles = nt.titles;
  const awards = computeAwards(G, rep);
  updateReputation(G, rep, awards, nt);

  /* acumular carrera */
  const s = rep.stats, c = p.career;
  c.apps += s.apps; c.mins += s.mins; c.goals += s.goals; c.assists += s.assists;
  c.motm += s.motm; c.yellow += s.yellow; c.red += s.red;
  c.cs += s.cs; c.saves += s.saves; c.conceded += s.conceded;
  c.ratingSum += s.rating * (s.apps || 1); c.ratingN += (s.apps || 1);
  c.seasons++;
  c.ntApps += nt.caps + nt.tournaments.reduce((a, t) => a + t.caps, 0);
  c.ntGoals += nt.goals + nt.tournaments.reduce((a, t) => a + t.goals, 0);
  p.nt.caps += nt.level === 'Absoluta' ? nt.caps + nt.tournaments.reduce((a, t) => a + t.caps, 0) : 0;
  p.nt.goals += nt.level === 'Absoluta' ? nt.goals + nt.tournaments.reduce((a, t) => a + t.goals, 0) : 0;
  p.nt.level = nt.level;
  p.peakOvr = Math.max(p.peakOvr || 0, p.ovr);

  const allTitles = rep.titles.concat(nt.titles);
  allTitles.forEach((t) => { p.trophies.push({ ...t, season: seasonLabel(G), club: t.nt ? COUNTRY_BY_CODE[p.country].name : rep.club.name }); });
  c.trophies += allTitles.length;
  awards.forEach((a) => p.awards.push({ ...a, season: seasonLabel(G) }));

  /* objetivos */
  const objs = checkObjectives(G, rep);
  const objSp = objs.filter((o) => o.ok).reduce((a, o) => a + o.reward, 0);
  p.sp += objSp;
  rep.objs = objs; rep.objSp = objSp;

  /* moral y estado */
  const okRatio = objs.filter((o) => o.ok).length / Math.max(1, objs.length);
  p.morale = clamp(p.morale + (okRatio - 0.5) * 22 + (rep.titles.length ? 10 : 0), 10, 100);
  p.trust = clamp(p.trust + (s.rating - 6.6) * 12 + (s.mins > 1800 ? 5 : -6), 5, 100);
  p.fanLove = clamp(p.fanLove + (s.rating - 6.6) * 9 + (rep.titles.length ? 8 : 0) - 2, 5, 100);
  p.form = clamp(p.form * 0.4 + (s.rating - 6.7) * 12, -45, 45);
  p.fitness = clamp(p.fitness + 6 - rep.injuries.length * 6, 25, 100);
  if (rep.injuries.length) p.injuryHistory += rep.injuries.length;
  p.money = (p.money || 0) + p.wage * 0.55;

  /* historial */
  p.history.push({
    season: seasonLabel(G), club: rep.club.name, clubId: rep.club.id,
    league: rep.league ? rep.league.name : '', pos: rep.leaguePos, ovr: p.ovr,
    apps: s.apps, goals: s.goals, assists: s.assists, rating: s.rating,
    cs: s.cs, saves: s.saves, conceded: s.conceded, mins: s.mins,
    titles: allTitles.map((t) => t.name), awards: awards.map((a) => a.name),
  });

  /* la clasificacion que ha visto el jugador manda sobre el resto del mundo */
  G.lastTables = {};
  if (rep.league && rep.table) G.lastTables[leagueOfClub(G, rep.club)] = rep.table;

  /* hitos, récords y destacados: hacen que la temporada se sienta como un capítulo */
  rep.milestones = checkMilestones(G);
  rep.broken = brokenRecords(G, rep);      // antes de actualizar, para saber qué se ha batido
  rep.prev = p.history.filter((h) => h.rating != null).slice(-1)[0] || null;
  updateRecords(G, rep);
  rep.highlights = seasonHighlights(G, rep);

  G.lastReport = rep; G.lastNt = nt; G.lastAwards = awards;
  G.step = 'report';
  saveGame(G);
  renderStep();
}

function buildTableView(rep) {
  if (!rep.table || !rep.table.length) return '';
  const meId = rep.club.academy ? rep.club.parent : rep.club.id;
  const idx = rep.table.findIndex((r) => r.club.id === meId);
  const slice = [];
  rep.table.slice(0, 6).forEach((r) => slice.push(r));
  if (idx > 6) { slice.push(null); for (let i = Math.max(6, idx - 1); i <= Math.min(rep.table.length - 1, idx + 1); i++) slice.push(rep.table[i]); }
  return `<div class="card">
    <div class="tiny">Clasificación · ${esc(rep.league ? rep.league.name : '')}</div>
    <div class="tablewrap mt-s"><table>
      <thead><tr><th>#</th><th>Equipo</th><th class="num">Pts</th></tr></thead>
      <tbody>${slice.map((r) => r === null
        ? '<tr><td colspan="3" class="dim2 tc">···</td></tr>'
        : `<tr style="${r.club.id === meId ? 'background:#0f2419' : ''}">
            <td class="mono">${r.pos}</td>
            <td><div class="row" style="gap:7px">${crestSVG(r.club, 'crest-sm')}<span class="${r.club.id === meId ? 'b acc' : ''}">${esc(r.club.name)}</span></div></td>
            <td class="num b">${r.pts}</td></tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;
}

function devNarrative(p, dev) {
  if (dev.delta >= 5) return 'Un salto brutal. Ya no eres el mismo jugador que empezó el año.';
  if (dev.delta >= 2) return 'Progresas bien. Los minutos se están traduciendo en nivel.';
  if (dev.delta >= 1) return 'Mejoras poco a poco. El trabajo silencioso también cuenta.';
  if (dev.delta === 0) return p.age >= 29 ? 'Te mantienes. A tu edad, mantenerse ya es ganar.' : 'Te has estancado. Necesitas más minutos o un cambio de aires.';
  if (dev.delta >= -2) return 'Empieza la cuesta abajo. El cuerpo ya no responde igual.';
  return 'Caída fuerte. Los años y las lesiones pasan factura.';
}
ACTIONS.spend = (d) => {
  const G = window.G, p = G.player;
  if (p.sp <= 0) return;
  p.attrs[d.k] = clamp(p.attrs[d.k] + 1, 20, 99);
  p.sp--; p.ovr = computeOvr(p); p.value = playerValue(p);
  p.peakOvr = Math.max(p.peakOvr || 0, p.ovr);
  saveGame(G); renderStep();
};
ACTIONS.toMarket = () => {
  const G = window.G;
  G.market = generateMarket(G, G.lastReport);
  if (G.pendingMove) {
    G.market.options.unshift({
      type: 'transfer', club: G.pendingMove, forced: true,
      title: 'Fichar por el ' + G.pendingMove.name,
      desc: 'El movimiento que ya habías puesto en marcha.',
      wage: wageFor(G.pendingMove, G.player, squadRole(G.player, G.pendingMove).key),
      years: ri(2, 4), tags: ['Acuerdo cerrado'],
    });
    G.pendingMove = null;
  }
  G.step = 'market'; saveGame(G); renderStep();
};

function marketCard(G, o, i) {
  const p = G.player;

  }
  const c = o.club;
  const lg = LEAGUES[leagueOfClub(G, c)];
  const cc = COUNTRY_BY_CODE[c.country];

          ${o.wage != null ? chip('💰 ' + fmtWage(o.wage), '') : ''}
          ${o.years ? chip(o.years + ' años', '') : ''}

ACTIONS.mkOpt = (d) => {
  const G = window.G, p = G.player;
  const o = G.market.options[+d.i];
  if (o.type === 'retire') {
    if (!confirm('¿Seguro que quieres retirarte? Se acaba la carrera.')) return;
    p.retired = true; saveGame(G); return renderStep();
  }
  const prevClub = G.club;
  applyMove(G, o);
  if (prevClub.id !== G.club.id) {
    p.history.push({ season: seasonLabel(G) + ' →', club: G.club.name, move: true, note: 'Ficha por ' + G.club.name });
  }
  nextSeason(G);
};

/* ---------- Pasar de temporada ---------- */
function nextSeason(G) {
  const p = G.player;
  p.age++;
  if (p.contract < 99) p.contract = Math.max(0, p.contract - 1);
  G.seasonStart++;
  advanceWorld(G, G.lastTables);
  G.lastTables = null;

  // retirada forzosa
  if (p.age >= 41 || (p.age >= 35 && p.ovr < 58) || (p.age >= 38 && p.ovr < 66)) {
    p.retired = true; p.forcedRetire = true;
    saveGame(G); return renderStep();
  }
  startSeason(G, false);
}
